---
# Generated artifacts are not reviewed, so analysing them is noise.
#
# api/openapi.bundled.yaml is produced by `just openapi-bundle` from the
# multi-file tree under api/. Every finding in it is, by construction, already
# present in the source it was generated from — where Codacy does analyse it.
# Because the bundle is a file rather than a diff, every pre-existing finding in
# the spec re-appears as "new" the moment the bundle is added, which fails the
# new-issue gate for something nobody wrote.
#
# Concretely: the `BasicAuth` security scheme has been on main since long before
# the bundle existed and is deliberate — it is the operator's bootstrap
# credential and the lockout-recovery path, documented as such in the spec.
#
# api/openapi.bundled.json is the same document emitted a second time by the
# same recipe — read `openapi-bundle` in the justfile, which writes both from
# one source tree. Excluding only the YAML left the argument above applying to a
# file that was still analysed: every route added to the spec re-declares
# `BasicAuth` in the JSON twin, so each one arrives as a new high-severity
# finding against generated content nobody wrote. Both halves of one artifact,
# both excluded.

# The only SQL analyser Codacy runs here is TSQLLint, which checks Microsoft
# T-SQL. `ops/pg/*.sql` is PostgreSQL, so its findings are wrong by
# construction rather than merely noisy: the first one raised was "expected SET
# QUOTED_IDENTIFIER ON near top of file", a SQL Server directive that is a
# syntax error in PostgreSQL. No migration had been added since Codacy was
# enabled, so the first one to arrive met the rule and failed the new-issue
# gate for following the dialect the database actually speaks.
#
# The migrations are not unreviewed as a result: `just migrations-check` refuses
# edits to an applied file, `just grants-check` gates the app role's privileges
# against `ops/pg/README.md`, and the Postgres test tier exercises the schema
# they produce.

# The demo dossiers hold up to seven JWS compact strings each (`eyJ...`): a signed
# view or a signed manifest, which anyone can read and which contain no key. A
# secret scanner matches the shape of the string, not what is in it. They are
# also generated: `crates/dpp-vault/examples/generate_demo_dossiers.rs` rewrites
# every signature whenever the payload or the format changes, so each token
# re-appears as a new finding on a diff nobody wrote by hand. What holds them to
# account is `crates/dpp-vault/tests/demo_dossiers_verify.rs`, which checks every
# file against its recorded verdict.
exclude_paths:
  - "api/openapi.bundled.yaml"
  - "api/openapi.bundled.json"
  - "ops/pg/**"
  - "ops/demo/dossiers/**"
