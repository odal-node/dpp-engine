get:
  operationId: getImportTemplate
  summary: Download a CSV import template
  description: |
    Returns the canonical CSV import template for a product group (`battery`,
    `textile`). `?format=xlsx` returns 501 (download the CSV and open it in
    a spreadsheet app). Unauthenticated.
  tags:
    - Integrator
  parameters:
    - name: productGroup
      in: path
      required: true
      schema:
        type: string
        example: battery
    - name: format
      in: query
      schema:
        type: string
        enum:
          - csv
          - xlsx
        default: csv
  responses:
    '200':
      description: CSV template (Content-Disposition attachment).
      content:
        text/csv:
          schema:
            type: string
    '404':
      description: No template for this product group.
    '501':
      description: XLSX export not yet implemented.
