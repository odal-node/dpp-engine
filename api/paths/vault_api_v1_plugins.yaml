post:
  operationId: installPlugin
  summary: Install a signed product group plugin
  description: |
    Verify, persist, and hot-swap a signed product group plugin — no node restart.

    The node verifies the uploaded artifact's detached signature against its
    pinned publisher key, gates the plugin's declared ABI, instantiate-smokes
    the module, persists it (so a restart re-loads it), and atomically swaps
    it into service. Any rejection is fail-closed — the previously installed
    plugin keeps serving. Admin-scoped.

    Both a portable `.wasm` (compiled on the node) and a precompiled `.cwasm`
    (loaded only if it matches this node's engine) are accepted.
  tags:
    - Plugins
  security:
    - BearerApiKey: []
    - BasicAuth: []
  requestBody:
    required: true
    content:
      multipart/form-data:
        schema:
          type: object
          required:
            - wasm
            - sig
          properties:
            wasm:
              type: string
              format: binary
              description: >
                The `.wasm` or precompiled `.cwasm` plugin artifact. Its
                filename determines the product group when `productGroup` is omitted
                (`product-group-<key>.wasm`) and whether it is treated as precompiled
                (`.cwasm`).
            sig:
              type: string
              format: binary
              description: Detached Ed25519 signature over SHA-256 of the artifact bytes.
            productGroup:
              type: string
              description: Product group key; derived from the filename if omitted.
              example: battery
  responses:
    '201':
      description: Plugin verified, persisted, and now serving.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/InstalledPlugin.yaml
    '400':
      description: >-
        Malformed multipart body (missing `wasm`/`sig`, or the product group could not
        be determined).
    '401':
      $ref: ../components/responses/Unauthorized.yaml
    '403':
      description: A non-admin credential attempted to install a plugin.
    '422':
      description: >-
        The artifact was rejected — bad signature, incompatible ABI, or a
        non-instantiable/incompatible module.
    '501':
      description: This node has no plugin host configured; runtime install is unavailable.
