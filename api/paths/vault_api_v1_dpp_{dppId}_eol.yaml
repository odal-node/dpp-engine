post:
  operationId: declareDppEol
  summary: Declare a DPP end-of-life
  description: |
    Transition a `published` or `suspended` DPP to `deactivated`
    (terminal). The record is retained, never deleted — the passport
    outlives the product. Destruction (`reason.kind: destroyed`) is only
    lawful with a recognised derogation from the unsold-goods destruction
    ban (ESPR Art. 25 delegated act).
  tags:
    - DPP Lifecycle
  security:
    - BearerApiKey: []
    - BasicAuth: []
  parameters:
    - name: dppId
      in: path
      required: true
      schema:
        $ref: ../components/schemas/DppId.yaml
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/EolRequest.yaml
  responses:
    '200':
      description: DPP deactivated. Returns the full passport record.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/PassportResponse.yaml
    '401':
      $ref: ../components/responses/Unauthorized.yaml
    '404':
      $ref: ../components/responses/NotFound.yaml
    '409':
      $ref: ../components/responses/Conflict.yaml
    '400':
      $ref: ../components/responses/BadRequest.yaml
    '403':
      $ref: ../components/responses/Forbidden.yaml
