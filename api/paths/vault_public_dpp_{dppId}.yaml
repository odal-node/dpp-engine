get:
  operationId: publicGetDpp
  summary: Public read of a published DPP
  description: |
    Unauthenticated read of a published passport. Used by the resolver
    service internally. Returns 404 for drafts, 410 for suspended.
  tags:
    - Public (Vault)
  parameters:
    - name: dppId
      in: path
      required: true
      schema:
        $ref: ../components/schemas/DppId.yaml
    - name: schema_view
      in: query
      required: false
      description: >-
        Request a read-time schema-upcast view. Set to a newer product group schema
        version (e.g. `2.0.0`); the response becomes `{ passport, schemaView }`
        — the canonical signed passport plus the derived view with lens
        provenance. The original is never re-signed.
      schema:
        type: string
      example: 2.0.0
  responses:
    '200':
      description: >-
        Published passport record. With `?schema_view`, the body is instead `{
        passport, schemaView }`.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/PassportResponse.yaml
    '404':
      description: Not found or not published.
      content:
        application/problem+json:
          schema:
            $ref: ../components/schemas/Problem.yaml
    '410':
      description: Passport has been suspended.
      content:
        application/problem+json:
          schema:
            $ref: ../components/schemas/Problem.yaml
    '422':
      description: >-
        The requested `schema_view` is unavailable (no lens path, a downcast, or
        the passport has no product group data).
      content:
        application/problem+json:
          schema:
            $ref: ../components/schemas/Problem.yaml
    '400':
      $ref: ../components/responses/BadRequest.yaml
