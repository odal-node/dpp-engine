get:
  operationId: resolveByGtinVariantBatch
  summary: GS1 Digital Link resolver — GTIN + consumer product variant + batch/lot
  description: |
    A label that carries a consumer product variant (AI 22) and a batch or lot
    (AI 10). **The variant takes no part in the lookup**: the node holds no
    record at that level, so the label resolves exactly as
    `/01/{gtin}/10/{batch}` does, the lot's passport first and then the model's.
    Same behaviour as `/01/{gtin}` otherwise (`linkType` / `Accept`
    negotiation).
  tags:
    - Public Resolver
  security: []
  parameters:
    - name: gtin
      in: path
      required: true
      schema:
        type: string
        example: '09506000134352'
    - name: variant
      in: path
      required: true
      schema:
        type: string
      description: AI 22, the consumer product variant. Accepted and not looked up.
    - name: batch
      in: path
      required: true
      schema:
        type: string
      description: AI 10, the batch or lot. Selects the batch-level passport.
    - name: linkType
      in: query
      required: false
      schema:
        type: string
      description: e.g. linkset, gs1:pip, gs1:dpp
  responses:
    '200':
      description: RFC 9264 linkset (when a linkset is requested).
      content:
        application/linkset+json:
          schema:
            type: object
    '307':
      description: Redirect to the DPP page (`Location` header).
    '400':
      description: >-
        The GTIN in the path is not valid: not digits, the wrong length, or a
        wrong check digit.
    '404':
      description: >-
        No published DPP at any level the label names, or unknown link type.
    '410':
      $ref: ../../components/responses/Gone.yaml
    '409':
      $ref: ../../components/responses/PassportSignatureUnverified.yaml
    '502':
      $ref: ../../components/responses/ResolverUpstreamFailure.yaml
    '503':
      $ref: ../../components/responses/PassportVerificationUnavailable.yaml
