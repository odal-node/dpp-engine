get:
  operationId: resolveByGtin
  summary: GS1 Digital Link resolver
  description: |
    GS1 Digital Link resolution keyed by GTIN-14, the carrier this node prints
    for a model-level passport. It was assessed against release 1.2.1 of the GS1
    Conformant Resolver Standard, and this node does not claim to conform to it:
    `docs/architecture/GS1_RESOLVER_CONFORMANCE.md` in the engine repository
    lists, criterion by criterion, what is met and what is not.

    Behaviour depends on the `linkType` query / `Accept` header:
    - default → `307` redirect to the HTML DPP page
    - `?linkType=gs1:pip`, `gs1:dpp` or `gs1:defaultLink` → `307` redirect to
      the DPP page. Any other link type → `404`: the linkset does not offer it
    - `?linkType=linkset` or `Accept: application/linkset+json` → `200`
      RFC 9264 linkset

    A redirect carries the request's query string on to its target. A trailing
    slash is tolerated. A GTIN of fewer than 14 digits is read as its
    14-digit form, which is also how a linkset names it.

    A GTIN takes a consumer product variant (AI 22), a batch (AI 10) and a
    serial (AI 21), in that order and each optional, or a third-party
    extension (AI 235) on its own; each of those shapes is its own path below.
    Any other path under `/01/` cannot be a GS1 Digital Link, because its
    qualifiers are out of order, repeated, not ones a GTIN takes, or empty, and
    answers `400` without a lookup.

    A compressed link that holds an EPC binary string is read too, at the root
    of this host: `/eh…` (hexadecimal) or `/ex…` (URI-safe base 64). Only the
    SGTIN-96 and SGTIN-198 schemes are decoded; a link of any other scheme
    answers `404`, and one that cannot be decompressed answers `400`.
  tags:
    - Public Resolver
  security: []
  parameters:
    - name: gtin
      in: path
      required: true
      schema:
        type: string
        example: '09506000134352'
    - name: linkType
      in: query
      required: false
      schema:
        type: string
      description: e.g. linkset, gs1:pip, gs1:dpp
  responses:
    '200':
      description: >-
        RFC 9264 linkset (when a linkset is requested). It validates against
        GS1's linkset schema, is anchored at the uncompressed request URI, and
        holds the links of every level from the one the request names up to the
        GTIN.
      headers:
        Link:
          description: >-
            The JSON-LD context for the linkset, with relation
            `http://www.w3.org/ns/json-ld#context`.
          schema:
            type: string
      content:
        application/linkset+json:
          schema:
            type: object
    '307':
      description: >-
        Redirect to the DPP page (`Location` header), carrying the request's
        query string on.
    '400':
      description: >-
        The path is not a valid GS1 Digital Link: the GTIN is not digits, has
        the wrong length or a wrong check digit, or a qualifier is out of order,
        repeated, longer than its Application Identifier allows or outside
        GS1 character set 82, or `linkType` is given more than once.
    '404':
      description: No published DPP for this GTIN, or a link type the linkset does not offer.
    '410':
      $ref: ../../components/responses/Gone.yaml
    '409':
      $ref: ../../components/responses/PassportSignatureUnverified.yaml
    '502':
      $ref: ../../components/responses/ResolverUpstreamFailure.yaml
    '503':
      $ref: ../../components/responses/PassportVerificationUnavailable.yaml
