get:
  operationId: resolveByGtinBatchSerial
  summary: GS1 Digital Link resolver — GTIN + batch/lot + serial
  description: |
    The shape this node printed for a batched passport before its carrier
    followed the passport's stated level, and one any conformant label may
    carry. **The serial is the resolution key**: it names one passport
    whatever its level, so the batch is consulted only if the serial finds
    nothing. Then the lot's passport answers, and failing that the model's, as
    a GS1 resolver answers a granular identifier; `404` means nothing is on
    record at any level. Same behaviour as `/01/{gtin}` otherwise (`linkType` /
    `Accept` negotiation).
  tags:
    - Public Resolver
  security: []
  parameters:
    - name: gtin
      in: path
      required: true
      schema:
        type: string
        example: '09506000134352'
    - name: batch
      in: path
      required: true
      schema:
        type: string
      description: AI 10. Consulted only if the serial finds nothing.
    - name: serial
      in: path
      required: true
      schema:
        type: string
      description: AI 21, the carrier serial. Selects the passport.
    - name: linkType
      in: query
      required: false
      schema:
        type: string
      description: e.g. linkset, gs1:pip, gs1:dpp
  responses:
    '200':
      description: RFC 9264 linkset (when a linkset is requested).
      content:
        application/linkset+json:
          schema:
            type: object
    '307':
      description: Redirect to the DPP page (`Location` header).
    '400':
      description: >-
        The GTIN in the path is not valid: not digits, the wrong length, or a
        wrong check digit.
    '404':
      description: >-
        No published DPP at any level the label names, or unknown link type.
    '410':
      $ref: ../../components/responses/Gone.yaml
    '409':
      $ref: ../../components/responses/PassportSignatureUnverified.yaml
    '502':
      $ref: ../../components/responses/ResolverUpstreamFailure.yaml
    '503':
      $ref: ../../components/responses/PassportVerificationUnavailable.yaml
