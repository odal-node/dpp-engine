get:
  operationId: resolveByGtinBatchSerial
  summary: GS1 Digital Link resolver — GTIN + batch/lot + serial
  description: |
    The full shape this node's own carrier emits for a batched,
    serialised trade item. **Resolution is keyed on the GTIN alone**:
    `batch` and `serial` are accepted and ignored. Same behaviour as
    `/01/{gtin}` otherwise (`linkType` / `Accept` negotiation).
  tags:
    - Public Resolver
  security: []
  parameters:
    - name: gtin
      in: path
      required: true
      schema:
        type: string
        example: '09506000134352'
    - name: batch
      in: path
      required: true
      schema:
        type: string
      description: Accepted and ignored — not a resolution key.
    - name: serial
      in: path
      required: true
      schema:
        type: string
      description: Accepted and ignored — not a resolution key.
    - name: linkType
      in: query
      required: false
      schema:
        type: string
      description: e.g. linkset, gs1:pip, gs1:dpp
  responses:
    '200':
      description: RFC 9264 linkset (when a linkset is requested).
      content:
        application/linkset+json:
          schema:
            type: object
    '307':
      description: Redirect to the DPP page (`Location` header).
    '404':
      description: No published DPP for this GTIN, or unknown link type.
