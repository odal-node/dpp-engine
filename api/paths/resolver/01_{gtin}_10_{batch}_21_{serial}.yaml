get:
  operationId: resolveByGtinBatchSerial
  summary: GS1 Digital Link resolver — GTIN + batch/lot + serial
  description: |
    The shape this node printed for a batched passport before its carrier
    followed the passport's stated level, and one any conformant label may
    carry. **The serial is the resolution key**: it names one passport
    whatever its level, so the batch is not consulted. Same behaviour as
    `/01/{gtin}` otherwise (`linkType` / `Accept` negotiation).
  tags:
    - Public Resolver
  security: []
  parameters:
    - name: gtin
      in: path
      required: true
      schema:
        type: string
        example: '09506000134352'
    - name: batch
      in: path
      required: true
      schema:
        type: string
      description: AI 10. Not consulted once a serial is present.
    - name: serial
      in: path
      required: true
      schema:
        type: string
      description: AI 21, the carrier serial. Selects the passport.
    - name: linkType
      in: query
      required: false
      schema:
        type: string
      description: e.g. linkset, gs1:pip, gs1:dpp
  responses:
    '200':
      description: RFC 9264 linkset (when a linkset is requested).
      content:
        application/linkset+json:
          schema:
            type: object
    '307':
      description: Redirect to the DPP page (`Location` header).
    '404':
      description: No published DPP for this GTIN, or unknown link type.
    '410':
      $ref: ../../components/responses/Gone.yaml
    '409':
      $ref: ../../components/responses/PassportSignatureUnverified.yaml
    '502':
      $ref: ../../components/responses/ResolverUpstreamFailure.yaml
    '503':
      $ref: ../../components/responses/PassportVerificationUnavailable.yaml
