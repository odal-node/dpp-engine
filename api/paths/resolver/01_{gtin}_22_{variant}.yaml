get:
  operationId: resolveByGtinVariant
  summary: GS1 Digital Link resolver — GTIN + consumer product variant
  description: |
    A label that carries a consumer product variant (AI 22) after its GTIN.
    This node never prints one, but a label printed elsewhere may. **The
    variant takes no part in the lookup**: the node holds no record at that
    level, so the label resolves exactly as `/01/{gtin}` does. Same behaviour
    as `/01/{gtin}` otherwise (`linkType` / `Accept` negotiation).
  tags:
    - Public Resolver
  security: []
  parameters:
    - name: gtin
      in: path
      required: true
      schema:
        type: string
        example: '09506000134352'
    - name: variant
      in: path
      required: true
      schema:
        type: string
      description: AI 22, the consumer product variant. Accepted and not looked up.
    - name: linkType
      in: query
      required: false
      schema:
        type: string
      description: e.g. linkset, gs1:pip, gs1:dpp
  responses:
    '200':
      description: RFC 9264 linkset (when a linkset is requested).
      content:
        application/linkset+json:
          schema:
            type: object
    '307':
      description: Redirect to the DPP page (`Location` header).
    '400':
      description: >-
        The GTIN in the path is not valid: not digits, the wrong length, or a
        wrong check digit.
    '404':
      description: >-
        No published DPP at any level the label names, or unknown link type.
    '410':
      $ref: ../../components/responses/Gone.yaml
    '409':
      $ref: ../../components/responses/PassportSignatureUnverified.yaml
    '502':
      $ref: ../../components/responses/ResolverUpstreamFailure.yaml
    '503':
      $ref: ../../components/responses/PassportVerificationUnavailable.yaml
