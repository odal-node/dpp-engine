get:
  operationId: resolveByGtinBatch
  summary: GS1 Digital Link resolver (GTIN + batch/lot)
  description: |
    The carrier this node prints for a batch-level passport. **The batch is a
    resolution key**: it resolves to the batch-level passport for that lot,
    which the GTIN alone cannot name once a product has a passport per batch.
    A lot with no passport of its own resolves to the model-level passport, as
    a GS1 resolver answers a granular identifier; `404` means nothing is on
    record at any level. Same behaviour as `/01/{gtin}` otherwise (`linkType` /
    `Accept` negotiation).
  tags:
    - Public Resolver
  security: []
  parameters:
    - name: gtin
      in: path
      required: true
      schema:
        type: string
        example: '09506000134352'
    - name: batch
      in: path
      required: true
      schema:
        type: string
      description: AI 10, the batch or lot. Selects the batch-level passport.
    - name: linkType
      in: query
      required: false
      schema:
        type: string
      description: e.g. linkset, gs1:pip, gs1:dpp
  responses:
    '200':
      description: >-
        RFC 9264 linkset (when a linkset is requested). It validates against
        GS1's linkset schema, is anchored at the uncompressed request URI, and
        holds the links of every level from the one the request names up to the
        GTIN.
      headers:
        Link:
          description: >-
            The JSON-LD context for the linkset, with relation
            `http://www.w3.org/ns/json-ld#context`.
          schema:
            type: string
      content:
        application/linkset+json:
          schema:
            type: object
    '307':
      description: >-
        Redirect to the DPP page (`Location` header), carrying the request's
        query string on.
    '400':
      description: >-
        The path is not a valid GS1 Digital Link: the GTIN is not digits, has
        the wrong length or a wrong check digit, or a qualifier is out of order,
        repeated, longer than its Application Identifier allows or outside
        GS1 character set 82, or `linkType` is given more than once.
    '404':
      description: >-
        No published DPP at any level the label names, or a link type the linkset does not offer.
    '410':
      $ref: ../../components/responses/Gone.yaml
    '409':
      $ref: ../../components/responses/PassportSignatureUnverified.yaml
    '502':
      $ref: ../../components/responses/ResolverUpstreamFailure.yaml
    '503':
      $ref: ../../components/responses/PassportVerificationUnavailable.yaml
