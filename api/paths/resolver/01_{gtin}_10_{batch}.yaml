get:
  operationId: resolveByGtinBatch
  summary: GS1 Digital Link resolver — GTIN + batch/lot
  description: |
    Accepts the batch/lot segment (AI 10) a carrier may include.
    **Resolution is keyed on the GTIN alone**: `batch` is accepted and
    ignored, not looked up. Same behaviour as `/01/{gtin}` otherwise
    (`linkType` / `Accept` negotiation).
  tags:
    - Public Resolver
  security: []
  parameters:
    - name: gtin
      in: path
      required: true
      schema:
        type: string
        example: '09506000134352'
    - name: batch
      in: path
      required: true
      schema:
        type: string
      description: Accepted and ignored — not a resolution key.
    - name: linkType
      in: query
      required: false
      schema:
        type: string
      description: e.g. linkset, gs1:pip, gs1:dpp
  responses:
    '200':
      description: RFC 9264 linkset (when a linkset is requested).
      content:
        application/linkset+json:
          schema:
            type: object
    '307':
      description: Redirect to the DPP page (`Location` header).
    '404':
      description: No published DPP for this GTIN, or unknown link type.
