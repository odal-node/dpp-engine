post:
  operationId: verifyUploadedEvidenceDossier
  summary: Verify an uploaded dossier document
  description: >-
    Same checks as the stored-dossier verify endpoint, run against an uploaded
    document instead.
  tags:
    - Evidence Dossiers
  security:
    - BearerApiKey: []
    - BasicAuth: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/EvidenceDossier.yaml
  responses:
    '200':
      description: The verification report.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/VerificationReport.yaml
    '401':
      $ref: ../components/responses/Unauthorized.yaml
    '422':
      description: Not a valid dossier — malformed JSON or an unrecognised field.
