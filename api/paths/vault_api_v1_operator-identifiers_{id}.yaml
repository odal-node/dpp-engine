delete:
  operationId: removeOperatorIdentifier
  summary: Remove an operator identifier
  description: >-
    Retires the identifier (soft-delete): the row is kept as Art. 13 provenance
    for passports that already stamped its value — never hard-deleted. Requires
    an admin-scoped key.
  tags:
    - Operator Identifiers
  security:
    - BearerApiKey: []
    - BasicAuth: []
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    '204':
      description: Operator identifier removed.
    '401':
      $ref: ../components/responses/Unauthorized.yaml
    '403':
      $ref: ../components/responses/Forbidden.yaml
    '404':
      $ref: ../components/responses/NotFound.yaml
