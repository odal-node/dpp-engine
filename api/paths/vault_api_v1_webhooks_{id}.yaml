delete:
  operationId: removeWebhook
  summary: Remove a webhook subscription
  description: |
    Soft-removes a subscription (`active` set to false). Deliveries already
    queued still drain; no new events are enqueued. Admin-scoped.
  tags:
    - Webhooks
  security:
    - BearerApiKey: []
    - BasicAuth: []
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    '204':
      description: Subscription removed.
    '400':
      description: Invalid subscription id.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ApiError.yaml
    '401':
      $ref: ../components/responses/Unauthorized.yaml
    '404':
      $ref: ../components/responses/NotFound.yaml
