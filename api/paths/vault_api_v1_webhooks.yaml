get:
  operationId: listWebhooks
  summary: List webhook subscriptions
  description: |
    Lists webhook subscriptions (active and retired). The signing secret is
    never returned here — only in the create response. Admin-scoped.
  tags:
    - Webhooks
  security:
    - BearerApiKey: []
    - BasicAuth: []
  responses:
    '200':
      description: Subscriptions (secret redacted).
      content:
        application/json:
          schema:
            type: array
            items:
              type: object
              properties:
                id:
                  type: string
                  format: uuid
                url:
                  type: string
                events:
                  type: array
                  items:
                    type: string
                active:
                  type: boolean
                description:
                  type:
                    - string
                    - 'null'
                createdAt:
                  type: string
                  format: date-time
                updatedAt:
                  type: string
                  format: date-time
    '401':
      $ref: ../components/responses/Unauthorized.yaml
post:
  operationId: createWebhook
  summary: Create a webhook subscription
  description: |
    Register a receiver URL (must be https and resolve to a public host,
    unless the node sets WEBHOOK_ALLOW_PRIVATE_TARGETS). The response includes
    the `secret` — shown ONCE — used to verify the `X-Odal-Signature` header
    on every delivery. Admin-scoped.
  tags:
    - Webhooks
  security:
    - BearerApiKey: []
    - BasicAuth: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required:
            - url
          properties:
            url:
              type: string
              format: uri
              example: https://hooks.example.com/odal
            events:
              type: array
              items:
                type: string
              description: Event subjects to receive, or ["*"] for all. Defaults to all.
              example:
                - dpp.passport.published
                - dpp.passport.transferred
            description:
              type: string
  responses:
    '201':
      description: Subscription created. The `secret` field is shown ONCE.
      content:
        application/json:
          schema:
            type: object
            properties:
              id:
                type: string
                format: uuid
              url:
                type: string
              events:
                type: array
                items:
                  type: string
              active:
                type: boolean
              description:
                type:
                  - string
                  - 'null'
              createdAt:
                type: string
                format: date-time
              updatedAt:
                type: string
                format: date-time
              secret:
                type: string
                description: Signing secret — shown once, store it securely.
    '401':
      $ref: ../components/responses/Unauthorized.yaml
    '422':
      $ref: ../components/responses/ValidationError.yaml
