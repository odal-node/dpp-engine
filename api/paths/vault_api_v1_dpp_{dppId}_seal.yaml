get:
  operationId: getDppSeal
  summary: Fetch the passport's eIDAS qualified electronic seal
  description: |
    Returns the qualified seal a QTSP applied to this passport, together with
    the compact JWS it was taken over and that JWS's SHA-256 digest.

    The seal has its own route because it is stripped from every audience
    view, public included: it covers the **full**-payload `jwsSignature`, so
    attaching it to a redacted body would hand the reader a proof that
    verifies against nothing they received.

    **This node does not validate the seal.** A detached CAdES must be
    checked by an independent AdES validator against the EU Trusted List. A
    verdict from the node that bought the seal would attest nothing, so none
    is offered.

    `coverage` answers a narrower question that the node *can* answer, from
    its own records: `sealedPayloadHash` is the digest it asked the backend
    to seal, so a passport re-published after sealing shows as `superseded`
    without any AdES tooling. That is a record of what was requested, not
    proof of what the CAdES covers — the validator's extracted message
    digest is the cross-check. A `superseded` seal remains valid for the
    signature it does cover; a seal over the new signature has not landed
    yet.

    `404` when the passport has no seal — it may be unpublished, its seal may
    still be queued, or the node may have no QTSP configured. An unsealed
    passport has no seal resource rather than an empty one.
  tags:
    - DPP Management
  security:
    - BearerApiKey: []
    - BasicAuth: []
  parameters:
    - name: dppId
      in: path
      required: true
      schema:
        $ref: ../components/schemas/DppId.yaml
  responses:
    '200':
      description: The qualified seal and the signature it attests to.
      content:
        application/json:
          schema:
            type: object
            required:
              - declaredBy
              - format
              - sealValue
              - sealedAt
              - signingCertRef
              - placeholder
              - currentJws
              - currentPayloadHash
              - sealedPayloadHash
              - coverage
              - verification
            properties:
              declaredBy:
                type: object
                description: |
                  Who declared the content this seal covers, which is not who
                  sealed it. A seal proves a document came from whoever holds
                  the certificate; it carries no statement about scope, so
                  "we vouch for this content" and "we transmitted this intact"
                  look identical. Every audience view strips the seal, making
                  this the only surface where the two can be collapsed.
                required:
                  - manufacturer
                  - operatorIdentifier
                  - responsibilityMayHaveTransferred
                  - note
                properties:
                  manufacturer:
                    type: string
                    description: >
                      The manufacturer named in the sealed passport, frozen at
                      publish.
                  operatorIdentifier:
                    type: [string, 'null']
                    description: >
                      The Annex III(k) unique operator identifier recorded at
                      publish. `null` means none was recorded — never that none
                      applies.
                  responsibilityMayHaveTransferred:
                    type: boolean
                    description: |
                      True when the passport's transfer chain records a
                      completed handover, so the party responsible **now** is
                      not the one named above. The names above are frozen into
                      the sealed bytes and cannot be rewritten, so this flag is
                      the only honest way to say the answer is historical.
                  note:
                    type: string
                    description: >
                      States the sealing/authorship distinction rather than
                      leaving it to be inferred from field names.
              format:
                type: string
                description: AdES format of `sealValue`.
                example: CADES
              sealValue:
                type: string
                description: Base64 detached CAdES (`.p7s`) as returned by the QTSP.
              sealedAt:
                type: string
                format: date-time
              signingCertRef:
                type:
                  - string
                  - 'null'
                description: |
                  Hex SHA-256 of the certificate the seal names as its
                  signer, **as reported by the seal** — read out of the CAdES
                  structure, never verified.

                  It answers *which* certificate to ask about, not whether
                  that certificate was qualified or on the EU Trusted List
                  when the seal was made; both are the independent
                  validator's question. `null` when the seal predates
                  extraction or could not be parsed.
                pattern: ^[0-9a-f]{64}$
              placeholder:
                type: boolean
                description: |
                  `true` when this is a development placeholder with no legal
                  validity. A production node refuses to boot in that state.
              currentJws:
                type: string
                description: The passport's current compact JWS.
              currentPayloadHash:
                type: string
                description: |
                  Hex SHA-256 of `currentJws` — the digest a seal over this
                  passport's present signature would be taken over.
                pattern: ^[0-9a-f]{64}$
              sealedPayloadHash:
                type:
                  - string
                  - 'null'
                description: |
                  Hex SHA-256 this node asked the backend to seal, from the
                  outbox row that bought `sealValue`. `null` when the node
                  holds no such row — a seal restored from a backup or
                  produced elsewhere.
                pattern: ^[0-9a-f]{64}$
              coverage:
                type: string
                enum:
                  - current
                  - superseded
                  - unknown
                description: |
                  Whether the stored seal covers the passport's current
                  signature, per this node's own records.

                  `current` — the requested digest is the passport's current
                  one. `superseded` — the passport was re-published after
                  this seal was bought. `unknown` — no record; only the
                  external validator can answer.
              verification:
                type: string
                description: What was and was not checked by this node.
    '401':
      $ref: ../components/responses/Unauthorized.yaml
    '404':
      $ref: ../components/responses/NotFound.yaml
