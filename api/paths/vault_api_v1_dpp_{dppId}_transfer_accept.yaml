post:
  operationId: acceptDppTransfer
  summary: Accept a pending transfer of responsibility
  description: |
    The incoming operator's signature completes a pending handover: the
    outgoing operator's signature is verified before the node countersigns
    on the incoming operator's behalf, and the incoming operator becomes
    the passport's current responsible operator.
  tags:
    - DPP Lifecycle
  security:
    - BearerApiKey: []
    - BasicAuth: []
  parameters:
    - name: dppId
      in: path
      required: true
      schema:
        $ref: ../components/schemas/DppId.yaml
  responses:
    '200':
      description: Transfer completed.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/TransferRecord.yaml
    '401':
      $ref: ../components/responses/Unauthorized.yaml
    '404':
      description: |
        This DPP has no transfer chain at all — no handover has ever been
        initiated for it. A chain that exists but carries nothing pending is a
        `422`, not this.
      content:
        application/problem+json:
          schema:
            $ref: ../components/schemas/Problem.yaml
    '422':
      description: |
        There is no pending handover to accept, the pending record carries no
        outgoing signature, or that signature failed verification.
      content:
        application/problem+json:
          schema:
            $ref: ../components/schemas/Problem.yaml
    '400':
      $ref: ../components/responses/BadRequest.yaml
    '403':
      $ref: ../components/responses/Forbidden.yaml
