get:
  operationId: getImportJobStatus
  summary: Poll an async import job
  description: |
    Returns the status and progress of an async import job. Requires the
    same bearer auth as the import endpoint (validated against the vault).
  tags:
    - Integrator
  security:
    - BearerApiKey: []
  parameters:
    - name: job_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    '200':
      description: Job status and progress.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/JobStatusResponse.yaml
    '400':
      description: Invalid job ID format.
    '401':
      $ref: ../components/responses/Unauthorized.yaml
    '404':
      $ref: ../components/responses/NotFound.yaml
