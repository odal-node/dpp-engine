get:
  operationId: getDpp
  summary: Get a DPP (write-side)
  description: |
    Retrieve the full DPP record including drafts.
    Scoped to the authenticated operator. For the public read
    (post-publish), use the resolver's `GET /dpp/{dppId}`.
  tags:
    - DPP Management
  security:
    - BearerApiKey: []
    - BasicAuth: []
  parameters:
    - name: dppId
      in: path
      required: true
      schema:
        $ref: ../../components/schemas/passport/DppId.yaml
  responses:
    '200':
      description: Full DPP record.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/passport/PassportResponse.yaml
    '401':
      $ref: ../../components/responses/Unauthorized.yaml
    '404':
      $ref: ../../components/responses/NotFound.yaml
    '400':
      $ref: ../../components/responses/BadRequest.yaml
put:
  operationId: updateDpp
  summary: Update a DPP
  description: |
    JSON merge-patch on a `draft` or `active` DPP.
    The request body is a free-form JSON object; only supplied
    fields are changed. Returns `409 Conflict` if the DPP is
    `suspended` or `archived`.
  tags:
    - DPP Management
  security:
    - BearerApiKey: []
    - BasicAuth: []
  parameters:
    - name: dppId
      in: path
      required: true
      schema:
        $ref: ../../components/schemas/passport/DppId.yaml
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          description: Free-form merge-patch. Supply only the fields being changed.
  responses:
    '200':
      description: Updated DPP record.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/passport/PassportResponse.yaml
    '401':
      $ref: ../../components/responses/Unauthorized.yaml
    '404':
      $ref: ../../components/responses/NotFound.yaml
    '409':
      $ref: ../../components/responses/Conflict.yaml
    '400':
      $ref: ../../components/responses/BadRequest.yaml
    '403':
      $ref: ../../components/responses/Forbidden.yaml
    '422':
      $ref: ../../components/responses/ValidationError.yaml
