post:
  operationId: relintDpp
  summary: Re-check plausibility-lint findings
  description: |
    Recomputes the plausibility lint and persists the refreshed `lintResult`
    (pack version, findings, assessed-at timestamp). Findings are non-binding —
    arithmetic and physical-plausibility checks distinct from binding
    compliance rules — and never gate publish or any other transition.

    Two sets of checks run. The `dpp-rules` plausibility **pack** runs against
    the DPP's current product group data, and `packVersion` names its version.
    The **envelope** checks run against fields every product group carries, so
    they apply to a DPP with no product group data at all: today that is
    `lineage.life_status_unsupported`, which reports a `lifeStatus` that the
    record's own `derivedFrom` edges do not support — a unit claiming
    `remanufactured` whose only edge says `repurposing`, or an `original` that
    claims a predecessor at all.

    The status is stored and then checked rather than derived from the edges.
    Regulation (EU) 2023/1542 Art. 77(7) permits several predecessors with
    nothing forcing them to share an operation, so a unit built from one
    repurposed and one remanufactured predecessor has no unambiguous derived
    status; the check asks that **at least one** edge support the claim.

    Works regardless of DPP status, including `active` (published):
    re-checking does not retroactively affect the passport's JWS
    signature, which is frozen over whatever `lintResult` looked like at
    publish time. No request body is required.

    The response also reports **`publishReadiness`**: whether this passport
    would clear the category mandatory-content gate and the product-group
    data/schema gates. That is the gate that most often refuses a battery, and
    asking it here is the only way to learn the answer without attempting the
    publish.

    `publishReadiness.passportScope` answers a different question from the
    blockers: whether Art. 77(1) requires a battery passport for this record at
    all. The Regulation defines five battery categories and that article reaches
    three — LMT, electric-vehicle, and industrial above 2 kWh — so a portable or
    SLI passport is voluntary. This node applies the content gate either way,
    which for a voluntary passport is stricter than the article requires; the
    `note` says so rather than leaving the caller to wonder why they are being
    asked.
  tags:
    - DPP Management
  security:
    - BearerApiKey: []
    - BasicAuth: []
  parameters:
    - name: dppId
      in: path
      required: true
      schema:
        $ref: ../../components/schemas/passport/DppId.yaml
  responses:
    '200':
      description: |
        Lint findings refreshed. Returns the full passport record, plus
        `publishReadiness` — whether this passport would clear the publish gates
        that can be answered without attempting the transition.
      content:
        application/json:
          schema:
            allOf:
              - $ref: ../../components/schemas/passport/PassportResponse.yaml
              - type: object
                required:
                  - publishReadiness
                properties:
                  publishReadiness:
                    $ref: ../../components/schemas/passport/PublishReadiness.yaml
    '401':
      $ref: ../../components/responses/Unauthorized.yaml
    '404':
      $ref: ../../components/responses/NotFound.yaml
    '400':
      $ref: ../../components/responses/BadRequest.yaml
    '403':
      $ref: ../../components/responses/Forbidden.yaml
