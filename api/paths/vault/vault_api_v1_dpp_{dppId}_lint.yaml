post:
  operationId: relintDpp
  summary: Re-check plausibility-lint findings
  description: |
    Recomputes the `dpp-rules` plausibility lint pack against the DPP's
    current product group data and persists the refreshed `lintResult` (pack
    version, findings, assessed-at timestamp). Findings are non-binding —
    arithmetic and physical-plausibility checks distinct from binding
    compliance rules — and never gate publish or any other transition.

    Works regardless of DPP status, including `active` (published):
    re-checking does not retroactively affect the passport's JWS
    signature, which is frozen over whatever `lintResult` looked like at
    publish time. No request body is required.

    The response also reports **`publishReadiness`**: whether this passport
    would clear the category mandatory-content gate and the product-group
    data/schema gates. That is the gate that most often refuses a battery, and
    asking it here is the only way to learn the answer without attempting the
    publish.
  tags:
    - DPP Management
  security:
    - BearerApiKey: []
    - BasicAuth: []
  parameters:
    - name: dppId
      in: path
      required: true
      schema:
        $ref: ../../components/schemas/passport/DppId.yaml
  responses:
    '200':
      description: |
        Lint findings refreshed. Returns the full passport record, plus
        `publishReadiness` — whether this passport would clear the publish gates
        that can be answered without attempting the transition.
      content:
        application/json:
          schema:
            allOf:
              - $ref: ../../components/schemas/passport/PassportResponse.yaml
              - type: object
                required:
                  - publishReadiness
                properties:
                  publishReadiness:
                    $ref: ../../components/schemas/passport/PublishReadiness.yaml
    '401':
      $ref: ../../components/responses/Unauthorized.yaml
    '404':
      $ref: ../../components/responses/NotFound.yaml
    '400':
      $ref: ../../components/responses/BadRequest.yaml
    '403':
      $ref: ../../components/responses/Forbidden.yaml
