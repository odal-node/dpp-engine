post:
  operationId: publishDpp
  summary: Publish a DPP
  description: |
    Transition a DPP from `draft` to `active`.

    On success:
    1. `qrCodeUrl` is set to the passport's GS1 Digital Link carrier:
       `{resolverBase}/01/{gtin}/21/{serial}` for a trade item, else
       `{resolverBase}/dpp/{id}`
    2. The identity service signs the VC payload with Ed25519. Publishing fails
       closed: when the signer cannot sign, the answer is `500` and the passport
       stays a `draft` with no `jwsSignature`, rather than being published
       without a signature the resolver would then refuse to serve
    3. `retentionLocked` is set to `true` permanently
    4. `status` = `active`, `publishedAt` = now
    5. A `dpp.published` NATS event is emitted (fire-after-commit)

    No request body is required.

    Refused with `422` naming `/carrierSerial` when another published passport
    already prints the same carrier serial under the same GTIN and is not in
    this one's amendment chain. Create refuses that too, but two creates that
    arrive together can both pass it; this is where the label goes live, so
    the second to publish stays a draft rather than making one label name two
    passports.

    A draft states its `responsibleOperator` here, from the operator as it
    stands now and the role and legal basis it was given. Where the product
    group's passport obligation is live, a passport whose responsible operator
    cannot be stated is refused with `422`, naming what the node lacks: no role
    and basis were stated for the node or with the passport, or the operator's
    `legalName` or `country` is not configured. Nothing is defaulted, because a
    published passport is corrected by a successor and not an edit. Any other
    product group publishes without one.
  tags:
    - DPP Lifecycle
  security:
    - BearerApiKey: []
    - BasicAuth: []
  parameters:
    - name: dppId
      in: path
      required: true
      schema:
        $ref: ../../components/schemas/passport/DppId.yaml
  responses:
    '200':
      description: DPP published successfully. Returns the full passport record.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/passport/PassportResponse.yaml
    '401':
      $ref: ../../components/responses/Unauthorized.yaml
    '404':
      $ref: ../../components/responses/NotFound.yaml
    '409':
      $ref: ../../components/responses/Conflict.yaml
    '400':
      $ref: ../../components/responses/BadRequest.yaml
    '403':
      $ref: ../../components/responses/Forbidden.yaml
    '422':
      $ref: ../../components/responses/ValidationError.yaml
    '500':
      $ref: ../../components/responses/InternalServerError.yaml
