post:
  operationId: reloadRuleset
  summary: Re-read the signed ruleset channel and hot-swap a verified bundle
  description: |
    Adopt a newly published compliance ruleset — no node restart.

    The node re-reads its configured channel, verifies the bundle's manifest
    signature against the pinned publisher key, checks the content hash, refuses
    a bundle whose rules do not take effect yet or that is older than the one
    already in force, and only then swaps it in atomically. Requests in flight
    keep serving throughout. Any rejection is fail-closed — the ruleset already
    in force keeps validating. Admin-scoped.

    The node also polls the channel on its own (`RULESET_POLL_INTERVAL_SECS`),
    so this route is how an operator says "take it now", not the only way a swap
    happens.

    Re-reading a channel that has not changed is a **success** with
    `changed: false`, not an error.
  tags:
    - Ruleset
  security:
    - BearerApiKey: []
    - BasicAuth: []
  responses:
    '200':
      description: >-
        The channel was read. `changed` says whether the ruleset in force moved.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/access/RulesetReload.yaml
    '401':
      $ref: ../../components/responses/Unauthorized.yaml
    '403':
      description: A non-admin credential attempted to reload the ruleset.
    '422':
      description: >-
        The bundle was refused and the ruleset in force is unchanged. The
        problem `code` says which refusal: `RULESET_REJECTED` (bad signature,
        content-hash mismatch, or a malformed manifest — distrust the bytes),
        `RULESET_NOT_YET_EFFECTIVE` (authentic but its rules start later — leave
        it staged and re-offer it once the date arrives), or
        `RULESET_SUPERSEDED` (authentic but older than what is running — the
        rollback refusal; something served a stale bundle).
    '501':
      description: >-
        This node has no signed ruleset channel configured; it is running its
        compiled-in baseline and there is nothing to re-read.
    '503':
      description: >-
        The channel could not be read at all — the bundle file is missing or
        unreadable, or what arrived was not a bundle. Transport-level; retry
        once the drop is fixed.
