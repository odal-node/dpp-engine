get:
  operationId: publicGetDppByGtin
  summary: Public read of a published DPP by its printed GS1 label
  description: |
    Unauthenticated read of the published passport a GS1 label names — the
    same signed public view the by-id route serves, found by the label printed
    on the product instead of by passport id. The resolver's
    `/01/{gtin}[/10/{batch}][/21/{serial}]` routes forward the label here.

    **The label's qualifiers select the passport.** One GTIN can have a
    passport for the model, one per batch and one per unit, so the GTIN alone
    does not name one:

    - `serial` (AI 21) names the passport whose carrier serial it is, at any
      level. `batch` is not consulted once a serial is given.
    - `batch` (AI 10) alone names the batch-level passport for that lot.
    - Neither names the model-level passport, or a passport with no batch and
      no serial.

    A label keeps working after its passport is amended: the successor is
    served, not the superseded record.

    **A withdrawn passport answers `410`, not `404`.** That distinction is the
    point of this route rather than a detail of it: `404` means no passport for
    this label was ever published here, while `410` means one was and has since
    been suspended. Only the second is a recall signal, and a consumer who
    scanned a product needs to be able to tell them apart. `422` is a
    structurally invalid GTIN-14 — a bad check digit or wrong length — which is
    a malformed request rather than an answer about any product.

    Only the passport's `public` audience view is returned, carrying the
    publish-time `publicJwsSignature` that covers exactly those bytes.
    Restricted fields are not present at all.
  tags:
    - Public (Vault)
  security: []
  parameters:
    - name: gtin
      in: path
      required: true
      schema:
        type: string
        description: GS1 GTIN-14 (14 digits, mod-10 check digit).
        example: '09506000134352'
    - name: batch
      in: query
      required: false
      description: The label's AI 10 value, the batch or lot.
      schema:
        type: string
      example: LOT-2026-A
    - name: serial
      in: query
      required: false
      description: The label's AI 21 value, the serial.
      schema:
        type: string
      example: 3a9c1e0b7d2f4a6c8e10
    - name: schema_view
      in: query
      required: false
      description: >-
        Request a read-time schema-upcast view (see the by-id read). The
        response becomes `{ passport, schemaView }`.
      schema:
        type: string
      example: 2.0.0
  responses:
    '200':
      description: >-
        Published passport record. With `?schema_view`, the body is instead `{
        passport, schemaView }`.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/passport/PassportResponse.yaml
    '404':
      $ref: ../../components/responses/NotFound.yaml
    '422':
      description: >-
        The GTIN is not a valid GTIN-14, or the requested `schema_view` is
        unavailable.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/errors/Problem.yaml
    '410':
      $ref: ../../components/responses/Gone.yaml
