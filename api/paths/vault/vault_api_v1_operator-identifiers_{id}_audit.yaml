get:
  operationId: getOperatorIdentifierAudit
  summary: Operator-identifier audit trail
  description: |
    Append-only mutation history for one operator identifier (added,
    retired, set-primary), oldest first. Requires an admin-scoped key.
  tags:
    - Operator Identifiers
  security:
    - BearerApiKey: []
    - BasicAuth: []
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    '200':
      description: List of audit entries for this operator identifier.
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: ../../components/schemas/operator/RegistryIdentityAudit.yaml
    '401':
      $ref: ../../components/responses/Unauthorized.yaml
    '403':
      $ref: ../../components/responses/Forbidden.yaml
    '400':
      $ref: ../../components/responses/BadRequest.yaml
