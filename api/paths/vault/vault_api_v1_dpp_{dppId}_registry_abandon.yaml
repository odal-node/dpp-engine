post:
  operationId: abandonDppRegistration
  summary: Give up on a registration the registry never accepted
  description: |
    Ends a passport's registry registration queue row as `abandoned`, for a
    registration the registry never accepted. The node retries a `pending`
    registration with backoff for as long as the passport is published; when the
    registry refuses the payload on every attempt, or the product is withdrawn
    before it was ever registered, that is forever. This is how a person ends it.

    **The registry is checked, not taken on trust.** A `pending` registration
    whose first attempt got through and whose reply was lost looks exactly like
    one that never did: the registry holds a submission for the passport and this
    node has no record that it does. Abandoning that one would leave a
    registration the registry may grant that the node believes it dropped. So the
    registry's task list is read, and the request is refused unless **all** of it
    was read and none of it reports the unique product identifier the passport
    was submitted under. A list too long to read in full, a task still being
    checked, and a connection that cannot look a submission up are each refused
    with `422`: none of them shows the registry to hold nothing. A submission the
    registry does hold is a `409`, and names its correlation identifier.

    **Only after an attempt has failed.** The registration must be `pending`, must
    have been tried at least once, and must be waiting for its next attempt. A row
    being attempted is still due, and only a finished attempt pushes it out, so
    this cannot land between the node reading the row and submitting it. A
    `submitted` registration is one the registry holds and is never abandoned from
    here.

    **It ends the queue row, not the passport.** The passport stays published, and
    `GET /vault/api/v1/registry` counts the registration as `abandoned` so it is
    not read as still owed. Nothing the node's drain writes moves a row out of
    `abandoned`. Publishing the passport again queues it afresh.

    The write is recorded in the passport's audit trail as `registry_abandoned`,
    with who gave up on it, the reason, and what the row had been saying.

    Not idempotency-keyed, and does not need to be: a registration that is already
    abandoned answers `200` with `alreadyAbandoned: true` and changes nothing, asks
    the registry nothing and writes the trail nothing, so a retry after a lost
    response does not fail on its own success.
  tags:
    - Registry
  security:
    - BearerApiKey: []
    - BasicAuth: []
  parameters:
    - name: dppId
      in: path
      required: true
      schema:
        $ref: ../../components/schemas/passport/DppId.yaml
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/registry/AbandonRegistrationRequest.yaml
  responses:
    '200':
      description: |
        The registration is abandoned: by this request, or already.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/registry/AbandonRegistrationResponse.yaml
    '401':
      $ref: ../../components/responses/Unauthorized.yaml
    '403':
      $ref: ../../components/responses/Forbidden.yaml
    '404':
      description: |
        No passport with that id, or the passport has no registry registration —
        it owes one only once published. Distinct from `409` and `422`, which mean
        a registration exists and cannot be abandoned as it stands.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/errors/Problem.yaml
    '409':
      description: |
        The registration cannot be abandoned. The detail says which: the registry
        has accepted the submission, so it holds a registration or is deciding one;
        the registry has already ruled; the registry holds a submission for the
        passport's identifier (the detail names its correlation identifier, or the
        candidates); or the node has not tried the registration yet, or is about to
        or is trying it now.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/errors/Problem.yaml
    '422':
      description: |
        The registry could not be shown to hold nothing for the passport, so the
        registration was not abandoned. The detail says which: part of the task list
        was not read, or a task is still being checked; this node's registry
        connection cannot look a submission up; or the registration's stored payload
        is unreadable, so there is nothing to look up by. Also returned for a
        `reason` that is empty, over 500 characters, or contains control characters.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/errors/Problem.yaml
    '501':
      description: This node has no registry queues, so there is no registration to abandon.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/errors/Problem.yaml
    '502':
      description: |
        The registry could not be read, so it could not be shown to hold nothing and
        the registration was not abandoned. Safe to retry.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/errors/Problem.yaml
    '400':
      $ref: ../../components/responses/BadRequest.yaml
