get:
  operationId: getDppVersions
  summary: List a DPP's archived versions, or reconstitute one
  description: |
    Returns every archived version of a passport, oldest first — or, with
    `asOf`, the single version that was current at that instant.

    ✅ EN 18221:2026 clause 4.2: *"the archived version corresponding to a given
    point in time shall be retrievable by authenticated and authorized actors"*.

    🚨 **Not `POST /dpp/{dppId}/retire`.** That moves a passport to the terminal
    `retired` lifecycle status after its retention period has elapsed. This is
    the standard's sense of the word — historical versions of a passport that is
    still live — and the two are unrelated.

    Archiving begins at the **first change** to a passport, as the clause
    requires, so a passport that has never changed has no archived versions and
    returns an empty list. That is not a gap: the live record is the state at
    every moment before the first change.

    Each version is the complete record, so a reader reconstitutes rather than
    replays. Versions are append-only and are kept for the passport's lifetime.
  tags:
    - DPP Management
  security:
    - BearerApiKey: []
    - BasicAuth: []
  parameters:
    - name: dppId
      in: path
      required: true
      schema:
        $ref: ../../components/schemas/passport/DppId.yaml
    - name: asOf
      in: query
      required: false
      description: |
        An RFC 3339 instant. Returns the single version that was current then,
        rather than the whole list.

        `404` when no archived version covers that moment, in two distinct cases
        that the response body tells apart:

        - the passport had not changed by then, or the moment is after its most
          recent change. The **live** record is the state at that time, which
          `GET /dpp/{dppId}` already serves; this route does not return it, so
          that "which version is this" stays answerable.
        - the moment is **before the passport was created**, where nothing was
          its state — not an archived version, and not the live record either.

        🚨 The second case is a `404` rather than the initial version. Asking for
        a version at a time before the record existed is a question with no true
        answer, and answering with the initial one would assert that the passport
        existed then.
      schema:
        type: string
        format: date-time
  responses:
    '200':
      description: >-
        The archived versions, oldest first. With `asOf`, the one that was
        current then, as a one-element array.


        Always an array, with or without `asOf`: one response shape is simpler
        to consume than two, and a client that parses an array does not have to
        remember which query it sent to know what it is holding.


        An **empty** array is reachable only without `asOf`, and it says the
        passport has never changed — archiving begins at the first change, so
        there is nothing historical to return and the live record is the state
        at every moment so far. With `asOf`, a moment no archived version covers
        is a `404` rather than an empty array, because the answer there is the
        live record and this route deliberately does not serve it.
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: ../../components/schemas/passport-reports/PassportVersion.yaml
    '401':
      $ref: ../../components/responses/Unauthorized.yaml
    '404':
      $ref: ../../components/responses/NotFound.yaml
    '400':
      $ref: ../../components/responses/BadRequest.yaml
    '422':
      description: '`asOf` was given and is not an RFC 3339 timestamp.'
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/errors/Problem.yaml
