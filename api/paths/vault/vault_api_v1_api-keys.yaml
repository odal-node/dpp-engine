get:
  operationId: listApiKeys
  summary: List active API keys
  description: |
    Lists all active API keys for this deployment. Only the key prefix
    is returned — the full secret is shown once at creation time.
  tags:
    - API Keys
  security:
    - BearerApiKey: []
    - BasicAuth: []
  responses:
    '200':
      description: List of API keys.
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: ../../components/schemas/access/ApiKey.yaml
    '401':
      $ref: ../../components/responses/Unauthorized.yaml
    '403':
      $ref: ../../components/responses/Forbidden.yaml
post:
  operationId: createApiKey
  summary: Create a new API key
  description: |
    Generate a new API key. The response includes the full plain-text
    `secret` — this is the only time it will be shown. Store it securely.

    **A replayed request does not return the secret.** This route accepts an
    `Idempotency-Key`, but the secret is never stored, so a retry that finds a
    completed key answers with the key record and
    `"secretAlreadyDelivered": true` in place of `secret`. That is the honest
    answer: the credential exists and was handed to the first attempt. If that
    response was lost, revoke the key and create another.
  tags:
    - API Keys
  security:
    - BearerApiKey: []
    - BasicAuth: []
  parameters:
    - $ref: ../../components/parameters/IdempotencyKey.yaml
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/access/CreateApiKeyRequest.yaml
  responses:
    '201':
      description: API key created. The `secret` field is shown ONCE.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/access/CreatedApiKeyResponse.yaml
    '401':
      $ref: ../../components/responses/Unauthorized.yaml
    '422':
      $ref: ../../components/responses/ValidationError.yaml
    '403':
      $ref: ../../components/responses/Forbidden.yaml
    '409':
      $ref: ../../components/responses/IdempotentRequestInFlight.yaml
