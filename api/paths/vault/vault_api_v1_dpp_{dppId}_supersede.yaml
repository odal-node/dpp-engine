post:
  operationId: supersedeDpp
  summary: Retire a DPP in favour of a newer one
  description: |
    Marks the DPP in the path `superseded`, retiring it in favour of the
    replacement named in `supersededBy`.

    **The link is checked here, not written.** The successor must already carry
    `supersedesId` pointing back at this passport, set when it was created —
    `supersedesId` is a protected field and no field patch can add it later. A
    successor that does not declare the link is refused with `422`.

    That ordering is deliberate. Writing the link during this transition would
    leave, on a failure between the two writes, a retired passport with nothing
    pointing at its replacement — the one state a reader cannot recover from.
    Requiring the link to exist first makes that unreachable.

    **Both must already be published.** A draft successor retiring a live
    passport would leave the product with no servable record, and a
    not-yet-published successor may still fail its own gates. A predecessor that
    is not published has nothing to retire.

    Terminal and irreversible: a superseded passport accepts no further
    transitions, and the successor is what a reader follows forward. Like an
    archived one, it leaves the public tier.
  tags:
    - DPP Lifecycle
  security:
    - BearerApiKey: []
    - BasicAuth: []
  parameters:
    - name: dppId
      in: path
      required: true
      schema:
        $ref: ../../components/schemas/passport/DppId.yaml
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/passport-requests/SupersedeRequest.yaml
  responses:
    '200':
      description: DPP superseded. Returns the retired passport's record.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/passport/PassportResponse.yaml
    '401':
      $ref: ../../components/responses/Unauthorized.yaml
    '404':
      $ref: ../../components/responses/NotFound.yaml
    '409':
      $ref: ../../components/responses/Conflict.yaml
    '400':
      $ref: ../../components/responses/BadRequest.yaml
    '403':
      $ref: ../../components/responses/Forbidden.yaml
    '422':
      $ref: ../../components/responses/ValidationError.yaml
