get:
  operationId: listDpps
  summary: List DPPs
  description: |
    Paginated list of DPPs for the authenticated operator.
    Supports filtering by status, free-text search across
    `productName`, `batchId`, and `manufacturer.name`, and an exact
    `facilityId` match (ESPR Annex III). A grouping filter, never an
    isolation boundary.
  tags:
    - DPP Management
  security:
    - BearerApiKey: []
    - BasicAuth: []
  parameters:
    - name: q
      in: query
      schema:
        type: string
        pattern: '^[^\u0000]*$'
      description: Free-text search across productName, batchId, manufacturer.name
    - name: status
      in: query
      schema:
        $ref: ../../components/schemas/passport/PassportStatus.yaml
    - name: facilityId
      in: query
      schema:
        type: string
        pattern: '^[^\u0000]*$'
      description: >-
        Exact match on the facility identifier stamped on the passport (see GET
        /facilities).
    - name: limit
      in: query
      description: Maximum results to return (default 20, capped at 100).
      schema:
        type: integer
        format: int64
        minimum: 0
        maximum: 4294967295
        default: 20
    - name: skip
      in: query
      description: Offset into the result set (default 0).
      schema:
        type: integer
        format: int64
        minimum: 0
        maximum: 4294967295
        default: 0
  responses:
    '200':
      description: Paginated list of DPPs.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/passport-reports/PassportListResponse.yaml
    '400':
      $ref: ../../components/responses/BadRequest.yaml
    '401':
      $ref: ../../components/responses/Unauthorized.yaml
