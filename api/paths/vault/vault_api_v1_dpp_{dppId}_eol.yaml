post:
  operationId: declareDppEol
  summary: Declare a DPP end-of-life
  description: |
    Transition a `published` or `suspended` DPP to `deactivated`
    (terminal). The record is retained, never deleted: the passport
    outlives the product. A destruction (`reason.kind: destroyed`) states
    whether the product was an unsold consumer product (`unsold`), and cites a
    derogation only where the ESPR Art. 25(1) ban reaches it: an unsold
    product with a CN code in Annex VII, destroyed from 19 July 2026 by an
    operator that its `enterpriseSize` does not exempt. The derogation is a
    point of Art. 2 of Commission Delegated Regulation (EU) 2026/296 by its
    name, as in `"reason": {"kind": "destroyed", "derogation":
    "damagedOrContaminated"}`. A destruction the ban reaches that cites none,
    and the free-text `{"category": ...}` of earlier releases, are refused
    with `422` before anything is written. The status is terminal, so a
    lawful basis that does not exist would otherwise stay on the record.
  tags:
    - DPP Lifecycle
  security:
    - BearerApiKey: []
    - BasicAuth: []
  parameters:
    - name: dppId
      in: path
      required: true
      schema:
        $ref: ../../components/schemas/passport/DppId.yaml
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/passport-requests/EolRequest.yaml
  responses:
    '200':
      description: DPP deactivated. Returns the full passport record.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/passport/PassportResponse.yaml
    '400':
      $ref: ../../components/responses/BadRequest.yaml
    '401':
      $ref: ../../components/responses/Unauthorized.yaml
    '403':
      $ref: ../../components/responses/Forbidden.yaml
    '404':
      $ref: ../../components/responses/NotFound.yaml
    '409':
      $ref: ../../components/responses/Conflict.yaml
    '415':
      $ref: ../../components/responses/UnsupportedMediaType.yaml
    '422':
      description: |
        A declaration refused, with the passport unchanged, for one of four
        reasons, each named in the `errors` member:

        - `/unsold`: the request does not say whether the product was an
          unsold consumer product;
        - `/reason/derogation`: the derogation is the free-text object
          `{"category": ...}` rather than a point of Art. 2 of Delegated
          Regulation (EU) 2026/296 by its name, and the refusal lists the
          points;
        - `/reason/derogation`: the ESPR Art. 25(1) ban reaches the product
          (unsold, a CN code in Annex VII, from 19 July 2026, an operator that
          is not exempt) and no point is cited;
        - `/materialRecovery`: the value holds a number dpp-core cannot hash
          exactly, such as an integer too large for a double to hold, so the
          declaration could not be chained into the audit trail.

        A name that is not one of the points is not a derogation and fails as
        the body is read.

        A `discardRecordId` is refused with the passport unchanged when the
        reason is not `destroyed`, when it names no discard record this node
        holds, or when the record and the reason do not cite the same derogation
        point: one citing a point and the other none, or two different points.
        Both citing none agree. Such a refusal carries no `errors` member. On
        success the passport is joined to the discard record in the same
        transaction as the destruction, and the audit entry records the citation.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/errors/Problem.yaml
