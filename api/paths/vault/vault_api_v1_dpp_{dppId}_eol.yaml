post:
  operationId: declareDppEol
  summary: Declare a DPP end-of-life
  description: |
    Transition a `published` or `suspended` DPP to `deactivated`
    (terminal). The record is retained, never deleted: the passport
    outlives the product. Destruction (`reason.kind: destroyed`) is only
    lawful with a recognised derogation from the unsold-goods destruction
    ban (ESPR Art. 25 delegated act), so the derogation's `category` must be
    one of the points of Art. 2 of Commission Delegated Regulation (EU)
    2026/296. Any other category is refused with `422` before anything is
    written, naming the points. The status is terminal, so a lawful basis that
    does not exist would otherwise stay on the record.
  tags:
    - DPP Lifecycle
  security:
    - BearerApiKey: []
    - BasicAuth: []
  parameters:
    - name: dppId
      in: path
      required: true
      schema:
        $ref: ../../components/schemas/passport/DppId.yaml
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/passport-requests/EolRequest.yaml
  responses:
    '200':
      description: DPP deactivated. Returns the full passport record.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/passport/PassportResponse.yaml
    '401':
      $ref: ../../components/responses/Unauthorized.yaml
    '404':
      $ref: ../../components/responses/NotFound.yaml
    '409':
      $ref: ../../components/responses/Conflict.yaml
    '400':
      $ref: ../../components/responses/BadRequest.yaml
    '403':
      $ref: ../../components/responses/Forbidden.yaml
    '422':
      description: |
        A destruction that cites a derogation category which is not a point of
        Art. 2 of Delegated Regulation (EU) 2026/296. The `errors` member names
        `/reason/derogation/category` and the points accepted. The passport is
        not changed.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/errors/Problem.yaml
