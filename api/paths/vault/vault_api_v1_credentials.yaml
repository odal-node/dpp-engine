post:
  operationId: issueCredential
  summary: Issue an access credential
  description: |
    Mints a DPP access credential signed with this node's own key, and returns
    it as a compact VC-JWT the holder presents in the `X-DPP-Credential` header
    on `GET /vault/credential/dpp/{dppId}`.

    **Only a legitimate interest, never an authority.** An operator naming its
    own authorised repairer attests something no one else can — membership of
    that network is a fact the operator alone holds, and no EU register of
    authorised repairers exists to hold it instead. An operator naming itself a
    market surveillance authority attests nothing, because the standing being
    claimed is conferred by a member state. The three authority roles are
    refused with `422`.

    **Issuing is not trusting.** A credential minted here is honoured by *this*
    node only if the node also trusts its own DID (`CREDENTIAL_ISSUERS_SELF`).
    An operator running more than one node ordinarily mints on one and honours
    it on another, so issuance is available regardless of that switch.

    **Revocation is expiry.** This node fetches W3C status lists but publishes
    none, so a credential it mints carries no `credentialStatus` and cannot be
    withdrawn before it lapses. `validForDays` is therefore capped rather than
    open-ended, and defaults to less than the cap.
  tags:
    - Access
  security:
    - BearerApiKey: []
    - BasicAuth: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/access/IssueCredentialRequest.yaml
  responses:
    '201':
      description: Credential issued.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/access/IssuedCredential.yaml
    '401':
      $ref: ../../components/responses/Unauthorized.yaml
    '403':
      $ref: ../../components/responses/Forbidden.yaml
    '400':
      $ref: ../../components/responses/BadRequest.yaml
    '422':
      description: |
        The request cannot produce a usable credential — an authority role, a
        `holderDid` that is not a DID, a `country` that is not alpha-2, or a
        `validForDays` outside 1–90.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/errors/Problem.yaml
    '501':
      description: |
        This deployment reaches no key store, so it cannot sign. The standalone
        vault binary answers this; the fused node does not.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/errors/Problem.yaml
