get:
  operationId: listUnsoldGoods
  summary: List unsold-goods disclosures
  description: |
    Every stored ESPR Art. 24 disclosure, one per financial year, the latest
    financial year first.

    Admin rather than write: these are the operator's own annual figures, and
    reading them back is an administrative act rather than part of producing
    passports.
  tags:
    - Unsold goods
  security:
    - BearerApiKey: []
    - BasicAuth: []
  responses:
    '200':
      description: The stored disclosures.
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: ../../components/schemas/unsold-goods/UnsoldGoodsDisclosure.yaml
    '401':
      $ref: ../../components/responses/Unauthorized.yaml
    '403':
      $ref: ../../components/responses/Forbidden.yaml
