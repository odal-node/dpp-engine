get:
  operationId: readDppByCredential
  summary: Audience-scoped read of a published DPP
  description: |
    Reads a published passport filtered to the caller's audience. No
    `X-DPP-Credential` header returns the same signed public view as
    `/public/dpp/{dppId}`. A verified credential returns the passport
    filtered to that audience's disclosure classes (ESPR Art. 77(2)),
    carrying the proof computed over that view. Credentialed reads are
    recorded to the passport's audit trail; anonymous reads are not.

    **A credential that does not cover this passport gets the public view,
    not an error.** A credential may narrow itself to product groups and to
    product categories, and both are checked against the passport being read:
    the group against its `productGroup`, the category against the one its
    data states, such as a battery's `batteryType`. A credential naming
    categories does not cover a passport whose group states none. Out of scope,
    a valid credential gets a `200` with the public view, byte-identical to
    `/public/dpp/{dppId}`, so the body carries no `disclosureSet`; only an
    elevated view names one. Denying instead would make this route a probe for
    which group or category a passport is in. The read is still recorded to
    the audit trail, with the public classes it was reduced to. `401` is for a
    credential that fails verification, never for one out of scope.

    **Why a credential was out of scope is in the
    `X-DPP-Credential-Out-Of-Scope` header**, not the body, because the body
    is the public view exactly: the payload `publicJwsSignature` signs. The
    group is checked first, so a credential that misses both axes is reported
    for the group. The header says nothing the public body does not: the group
    is in the body, and every group's category field is public.

    Returns the public view (not an error) when credential verification
    is not configured on this node.

    ✅ **A past version: `asOf`.** EN 18221:2026 clause 4.2 expects the
    version of a passport at a past moment to be retrievable by authenticated,
    authorised actors. With `asOf` this route returns the version that was
    current at that instant, to the readers who hold a credential and no API
    key, which `GET /dpp/{dppId}/versions?asOf=` is not for. It is the same body
    a live read gives the same credential: the payload that audience's
    publish-time proof covers, with that proof attached and `disclosureSet`
    naming the classes. A published passport's views are frozen when it is
    signed, so a version carries exactly the classes it was published with, and
    the proof verifies against the operator's key as a live one does.

    **`asOf` needs a credential that grants more than the public view.** The
    clause speaks of *authenticated, authorised* actors, so the rule above does
    not apply: without a credential the answer is `401`, and a credential that
    does not cover this passport gets `403` naming the axis in
    `X-DPP-Credential-Out-Of-Scope`. The public proof is frozen at publish, so it
    is the same bytes for every version of a published passport, and serving it
    for a past instant would answer a question about the past with the present
    passport. A node that cannot verify credentials answers `401` too, and says
    so. Both are decided before any version is read, and a credential presented
    against a passport it does not cover is recorded like any other.

    A moment after the passport's last change is answered by the live record,
    which is the state at that time. A moment before the passport was created
    is `404`, and one in the future `422`: nothing was its state then. A version
    is served on the terms a live read is: a moment the passport was a draft is
    `404`, and one it was suspended `410`.

    A read of a past version is recorded to the audit trail with the instant
    asked for (`asOf`) and the archived version that answered it
    (`archivedVersionId`, `null` when the live record did).
  tags:
    - Credentialed Access
  security: []
  parameters:
    - name: dppId
      in: path
      required: true
      schema:
        $ref: ../../components/schemas/passport/DppId.yaml
    - name: X-DPP-Credential
      in: header
      required: false
      description: |
        A verifiable access credential. Absent means public access, except with
        `asOf`, which is read only with one.
      schema:
        type: string
    - name: asOf
      in: query
      required: false
      description: |
        An RFC 3339 instant. Returns the passport as it stood then, filtered to
        the credential's audience. Requires a credential that covers this
        passport: see the description above.

        Not before the passport was created (`404`), and not in the future
        (`422`). Write the offset as `Z`: a literal `+` in a query string is a
        space.
      schema:
        type: string
        format: date-time
  responses:
    '200':
      description: Passport filtered to the resolved audience.
      headers:
        X-DPP-Credential-Out-Of-Scope:
          description: |
            Present only when a verified credential was served the public view
            because it does not cover this passport, naming the axis that
            missed:

            - `product-group`: the credential names product groups, and not
              this passport's;
            - `product-category`: it names product categories, and not the one
              this passport states;
            - `no-product-category`: it names product categories, and this
              passport's group states none.

            Absent on an anonymous read, on a read the credential covers, and
            on a node with credential verification unconfigured.
          required: false
          schema:
            type: string
            enum:
              - product-group
              - product-category
              - no-product-category
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/passport/PassportResponse.yaml
    '401':
      description: |
        The presented credential failed verification. Also `asOf` without a
        credential, which a past version is read only with, and `asOf` on a node
        that cannot verify credentials, which says so.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/errors/Problem.yaml
    '403':
      description: |
        `asOf` with a verified credential that grants nothing beyond the public
        view on this passport, so it cannot read a past version. Never returned
        without `asOf`, where such a credential is served the public view.
      headers:
        X-DPP-Credential-Out-Of-Scope:
          description: |
            The axis the credential missed, as on a `200`: `product-group`,
            `product-category` or `no-product-category`. Absent when the
            credential covers the passport and its audience is the public one.
          required: false
          schema:
            type: string
            enum:
              - product-group
              - product-category
              - no-product-category
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/errors/Problem.yaml
    '404':
      description: |
        Not found or not published. With `asOf`, also a moment before the
        passport was created, and a moment it was not yet published, where no
        published version covers it.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/errors/Problem.yaml
    '410':
      description: |
        This passport has been suspended. With `asOf`, it was suspended at that
        moment.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/errors/Problem.yaml
    '400':
      $ref: ../../components/responses/BadRequest.yaml
    '422':
      description: |
        `asOf` was given and is not an RFC 3339 timestamp, or is in the future.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/errors/Problem.yaml
