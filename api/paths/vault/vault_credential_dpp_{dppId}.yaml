get:
  operationId: readDppByCredential
  summary: Audience-scoped read of a published DPP
  description: |
    Reads a published passport filtered to the caller's audience. No
    `X-DPP-Credential` header returns the same signed public view as
    `/public/dpp/{dppId}`. A verified credential returns the passport
    filtered to that audience's disclosure classes (ESPR Art. 77(2)),
    carrying the proof computed over that view. Credentialed reads are
    recorded to the passport's audit trail; anonymous reads are not.

    **A credential that does not cover this passport gets the public view,
    not an error.** A credential may narrow itself to product groups and to
    product categories, and both are checked against the passport being read:
    the group against its `productGroup`, the category against the one its
    data states (a battery's `batteryType`, an electronics `productCategory`,
    and so on per group). A credential naming categories does not cover a
    passport whose group states none, such as textile or toy. Out of scope,
    a valid credential gets a `200` with the public view, byte-identical to
    `/public/dpp/{dppId}`, so the body carries no `disclosureSet`; only an
    elevated view names one. Denying instead would make this route a probe for
    which group or category a passport is in. The read is still recorded to
    the audit trail, with the public classes it was reduced to. `401` is for a
    credential that fails verification, never for one out of scope.

    **Why a credential was out of scope is in the
    `X-DPP-Credential-Out-Of-Scope` header**, not the body, because the body
    is the public view exactly: the payload `publicJwsSignature` signs. The
    group is checked first, so a credential that misses both axes is reported
    for the group. The header says nothing the public body does not: the group
    is in the body, and every group's category field is public.

    Returns the public view (not an error) when credential verification
    is not configured on this node.
  tags:
    - Credentialed Access
  security: []
  parameters:
    - name: dppId
      in: path
      required: true
      schema:
        $ref: ../../components/schemas/passport/DppId.yaml
    - name: X-DPP-Credential
      in: header
      required: false
      description: A verifiable access credential. Absent means public access.
      schema:
        type: string
  responses:
    '200':
      description: Passport filtered to the resolved audience.
      headers:
        X-DPP-Credential-Out-Of-Scope:
          description: |
            Present only when a verified credential was served the public view
            because it does not cover this passport, naming the axis that
            missed:

            - `product-group`: the credential names product groups, and not
              this passport's;
            - `product-category`: it names product categories, and not the one
              this passport states;
            - `no-product-category`: it names product categories, and this
              passport's group states none.

            Absent on an anonymous read, on a read the credential covers, and
            on a node with credential verification unconfigured.
          required: false
          schema:
            type: string
            enum:
              - product-group
              - product-category
              - no-product-category
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/passport/PassportResponse.yaml
    '401':
      description: The presented credential failed verification.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/errors/Problem.yaml
    '404':
      description: Not found or not published.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/errors/Problem.yaml
    '410':
      description: This passport has been suspended.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/errors/Problem.yaml
    '400':
      $ref: ../../components/responses/BadRequest.yaml
