post:
  operationId: generateDppEvidence
  summary: Generate and store a signed evidence dossier
  description: |
    Assembles a self-contained, signed dossier proving a passport's full
    proof chain — both JWS signatures, DID document snapshots, the
    hash-chained audit trail, and (when present) the transfer chain and
    end-of-life record — and persists it. See
    `docs/architecture/EVIDENCE-DOSSIER.md` for the complete format
    specification.

    Authenticated tier only — the dossier's `fullView` member carries
    full-view (non-redacted) passport data. Requires the passport to have
    been published at least once; a draft has no signature to export.
  tags:
    - Evidence Dossiers
  security:
    - BearerApiKey: []
    - BasicAuth: []
  parameters:
    - name: dppId
      in: path
      required: true
      schema:
        $ref: ../../components/schemas/passport/DppId.yaml
    - $ref: ../../components/parameters/IdempotencyKey.yaml
  responses:
    '201':
      description: The stored dossier record.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/evidence/EvidenceDossierRecord.yaml
    '401':
      $ref: ../../components/responses/Unauthorized.yaml
    '404':
      $ref: ../../components/responses/NotFound.yaml
    '409':
      $ref: ../../components/responses/Conflict.yaml
    '400':
      $ref: ../../components/responses/BadRequest.yaml
    '403':
      $ref: ../../components/responses/Forbidden.yaml
get:
  operationId: listDppEvidence
  summary: List stored evidence dossiers for a passport
  description: |
    Every evidence dossier generated for this passport, newest first.

    Summaries only — each row carries the dossier's id, when it was generated
    and what it covers, but not the document itself. Dossiers embed full-view
    passport data and both signature chains, so they are large and are fetched
    one at a time through `GET /api/v1/evidence/{id}`.

    A passport can have several: a dossier is a snapshot of the proof chain at
    the moment it was generated, so one taken before a transfer and one taken
    after are both valid and describe different states. Nothing here is
    superseded by anything else here, which is why the list is not filtered
    down to a latest.

    Empty for a passport that has never been published — there is no signature
    to attest to before then.
  tags:
    - Evidence Dossiers
  security:
    - BearerApiKey: []
    - BasicAuth: []
  parameters:
    - name: dppId
      in: path
      required: true
      schema:
        $ref: ../../components/schemas/passport/DppId.yaml
  responses:
    '200':
      description: Stored dossier summaries.
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: ../../components/schemas/evidence/EvidenceDossierSummary.yaml
    '401':
      $ref: ../../components/responses/Unauthorized.yaml
    '404':
      $ref: ../../components/responses/NotFound.yaml
    '400':
      $ref: ../../components/responses/BadRequest.yaml
