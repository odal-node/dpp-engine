get:
  operationId: getEvidenceDossier
  summary: Fetch one stored dossier's document
  description: >-
    Returns the dossier document itself: the same shape `POST .../evidence`
    returns on generation, not the summary wrapper the list endpoint shows.
  tags:
    - Evidence Dossiers
  security:
    - BearerApiKey: []
    - BasicAuth: []
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    '200':
      description: The evidence dossier document.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/evidence/EvidenceDossier.yaml
    '400':
      $ref: ../../components/responses/BadRequest.yaml
    '401':
      $ref: ../../components/responses/Unauthorized.yaml
    '404':
      $ref: ../../components/responses/NotFound.yaml
    '409':
      description: |
        The stored dossier embeds a transfer chain that dpp-core refuses to
        read, so it cannot be served as a dossier. The detail names the
        passport and the record dpp-core cited. Verifying it answers `200`,
        with the transfer-chain check failed, when the rest of the dossier
        reads, and `409` when the rest cannot be read either.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/errors/Problem.yaml
