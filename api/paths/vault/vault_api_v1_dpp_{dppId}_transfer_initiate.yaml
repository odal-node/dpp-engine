post:
  operationId: initiateDppTransfer
  summary: Initiate a transfer of responsibility
  description: |
    The outgoing operator signs a pending handover onto the passport's
    transfer chain. Only a `published` DPP can be transferred. In the
    managed single-node model the caller supplies both the outgoing and
    incoming operator; the node signs on the outgoing operator's behalf.
  tags:
    - DPP Lifecycle
  security:
    - BearerApiKey: []
    - BasicAuth: []
  parameters:
    - name: dppId
      in: path
      required: true
      schema:
        $ref: ../../components/schemas/passport/DppId.yaml
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/passport-requests/TransferInitiateRequest.yaml
  responses:
    '200':
      description: Transfer initiated (pending acceptance).
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/transfer/TransferRecord.yaml
    '401':
      $ref: ../../components/responses/Unauthorized.yaml
    '404':
      $ref: ../../components/responses/NotFound.yaml
    '409':
      $ref: ../../components/responses/Conflict.yaml
    '422':
      $ref: ../../components/responses/ValidationError.yaml
    '400':
      $ref: ../../components/responses/BadRequest.yaml
    '403':
      $ref: ../../components/responses/Forbidden.yaml
