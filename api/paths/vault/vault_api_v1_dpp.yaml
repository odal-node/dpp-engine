post:
  operationId: createDpp
  summary: Create a DPP
  description: |
    Create a new Digital Product Passport in `draft` status.
    Only `productName` (non-blank) and `manufacturer` (with `name`
    and `address`) are required. All other fields can be supplied
    later via `PUT` before publishing.

    Returns the full passport record with a server-assigned UUID v7 `id`.
  tags:
    - DPP Management
  security:
    - BearerApiKey: []
    - BasicAuth: []
  parameters:
    - $ref: ../../components/parameters/IdempotencyKey.yaml
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/passport-requests/CreatePassportRequest.yaml
        example:
          productName: EcoCell Pro 48V
          productGroup: battery
          manufacturer:
            name: EcoTech GmbH
            address: Hauptstraße 1, 10115 Berlin
          co2ePerUnit: 4.2
          batchId: BATCH-2026-04-001
          productGroupData:
            productGroup: battery
            productIdentifier:
              scheme: gs1
              gtin: '09506000134352'
            batteryChemistry: LFP
            nominalVoltageV: 48
            nominalCapacityAh: 100
            expectedLifetimeCycles: 3000
            co2ePerUnitKg: 45.2
  responses:
    '201':
      description: DPP created in draft status.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/passport/PassportResponse.yaml
    '401':
      $ref: ../../components/responses/Unauthorized.yaml
    '422':
      $ref: ../../components/responses/ValidationError.yaml
    '403':
      $ref: ../../components/responses/Forbidden.yaml
    '409':
      description: |
        One of two conflicts, told apart by the problem document.

        **An earlier attempt carrying this `Idempotency-Key` is still running.**
        Returned instead of letting a duplicate execute alongside it. Retry
        shortly with the same key and the same body; `Retry-After` carries the
        suggested delay. A claim left behind by a process that died mid-request
        is reclaimed automatically after 60 seconds, so this can never wedge a
        key permanently.

        **`carrierSerial` is already attributed to another passport under the
        same GTIN.** `errors[0].field` is `/carrierSerial`. A label that names
        two passports resolves to neither: choose another serial, or declare
        this passport as the successor of the one that holds it with
        `supersedesId`.
      headers:
        Retry-After:
          description: Seconds to wait before retrying. Sent for the idempotency conflict only.
          schema:
            type: integer
            minimum: 1
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/errors/Problem.yaml
