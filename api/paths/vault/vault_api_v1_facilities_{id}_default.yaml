post:
  operationId: setDefaultFacility
  summary: Set the default facility
  description: >-
    Makes this facility the sole default, stamped onto new passports. Requires
    an admin-scoped key.
  tags:
    - Facilities
  security:
    - BearerApiKey: []
    - BasicAuth: []
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    '204':
      description: Default facility set.
    '401':
      $ref: ../../components/responses/Unauthorized.yaml
    '403':
      $ref: ../../components/responses/Forbidden.yaml
    '404':
      $ref: ../../components/responses/NotFound.yaml
    '400':
      $ref: ../../components/responses/BadRequest.yaml
