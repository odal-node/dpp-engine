post:
  operationId: recordDppRegistryHandle
  summary: Record the registry's handle for a submission this node lost it for
  description: |
    Records the correlation identifier of a passport's registry submission, for a
    registration that is waiting for a person.

    The node's drain recovers a lost handle itself where it can, by the unique
    product identifier the passport was submitted under. It leaves three cases
    alone, because choosing would give a passport another passport's
    registration: several submissions report the identifier, none could be
    placed, and an adapter that cannot look a submission up. A row in one of them
    stays `submitted` and says why in `message` on
    `GET /vault/api/v1/dpp/{dppId}/registry`. Someone who has read the right
    correlation identifier off the registry's own interface gives it to the row
    here.

    **The handle is checked, not taken on trust.** The submission it names is
    read back from the registry, and the request is refused unless that
    submission reports the unique product identifier this passport was submitted
    under. A typo, or the handle of a neighbouring passport, is refused with
    `422` and nothing is recorded. An identifier is not unique to a passport — a
    successor can be submitted under its predecessor's — so a match says the
    submission *reports* the identifier, which is all the registry says.

    **It records the handle and nothing else.** The node's drain polls the
    submission by it on its next pass and applies the registry's ruling then,
    which is the one place that decides what a registration or a refusal does to
    a row. The row's attempts start again, so it stops reading as stalled while
    it is being polled. `registry` in the response is what the registry reported
    when the handle was checked, so the answer is known now without waiting for
    that pass.

    The write is recorded in the passport's audit trail as
    `registry_handle_recorded`, with who recorded which handle and what the
    registry reported.

    Not idempotency-keyed, and does not need to be: a row that already holds this
    handle answers `200` with `recorded: false` and changes nothing, so a retry
    after a lost response does not fail on its own success. A row that holds a
    *different* handle is refused with `409`; one the registry gave is never
    overwritten.
  tags:
    - Registry
  security:
    - BearerApiKey: []
    - BasicAuth: []
  parameters:
    - name: dppId
      in: path
      required: true
      schema:
        $ref: ../../components/schemas/passport/DppId.yaml
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/registry/RecordRegistryHandleRequest.yaml
  responses:
    '200':
      description: |
        The row holds the handle: this request recorded it, or the row already
        held it.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/registry/RecordRegistryHandleResponse.yaml
    '401':
      $ref: ../../components/responses/Unauthorized.yaml
    '403':
      $ref: ../../components/responses/Forbidden.yaml
    '404':
      description: |
        No passport with that id, or the passport has no registry registration —
        it owes one only once published. Distinct from `409` and `422`, which mean
        a registration exists and is not in a state, or does not match, what this
        records.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/errors/Problem.yaml
    '409':
      description: |
        The registration is not in a state that takes a handle. The detail says
        which: the registry has not accepted the submission yet, so there is no
        handle to record; it has already ruled, so none is needed; or the row
        already holds a different correlation identifier, which is never
        overwritten.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/errors/Problem.yaml
    '422':
      description: |
        The handle was not recorded because it was not shown to be this
        passport's. The detail says which: the submission it names reports other
        passports' identifiers, or none; the registry has not finished checking
        it, so it reports no passport yet; no submission with that identifier was
        found in the part of the registry's list this node read; this node's
        registry connection cannot read a submission's contents; or the row's
        stored payload is unreadable, so there is nothing to check against. Also
        returned for a `correlationId` that is empty, over 200 characters, or
        contains whitespace or control characters.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/errors/Problem.yaml
    '501':
      description: This node has no registry queues, so there is no registration to record a handle on.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/errors/Problem.yaml
    '502':
      description: |
        The registry could not be read, so the handle could not be checked and was
        not recorded. Safe to retry.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/errors/Problem.yaml
    '400':
      $ref: ../../components/responses/BadRequest.yaml
