post:
  operationId: setPrimaryOperatorIdentifier
  summary: Set the primary operator identifier
  description: >-
    Makes this identifier the sole primary, stamped onto new passports. Requires
    an admin-scoped key.
  tags:
    - Operator Identifiers
  security:
    - BearerApiKey: []
    - BasicAuth: []
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    '204':
      description: Primary operator identifier set.
    '401':
      $ref: ../../components/responses/Unauthorized.yaml
    '403':
      $ref: ../../components/responses/Forbidden.yaml
    '404':
      $ref: ../../components/responses/NotFound.yaml
    '400':
      $ref: ../../components/responses/BadRequest.yaml
