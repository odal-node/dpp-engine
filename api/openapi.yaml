tags:
  - name: DPP Management
    description: Create, read, update, list, and audit Digital Product Passports.
  - name: DPP Lifecycle
    description: >-
      Lifecycle transitions — publish, suspend, archive, end-of-life, and
      transfer of responsibility.
  - name: Evidence Dossiers
    description: >-
      Signed, self-contained evidence dossiers — generate, fetch, and verify
      (stored or uploaded) offline, with zero trust in the issuing node.
  - name: Registry
    description: >-
      EU-registry registration state — per-passport and operator-wide, plus the
      operator's verified-registry standing.
  - name: Scan Telemetry
    description: >-
      Aggregate, privacy-safe resolution counts — per-passport and operator-wide
      rollups.
  - name: Operator
    description: Operator configuration (branding, legal info, retention policy).
  - name: Facilities
    description: >-
      Manufacturing/processing facilities (ESPR Annex III) stamped onto new
      passports.
  - name: Operator Identifiers
    description: Economic-operator identifiers (ESPR Art. 13) stamped onto new passports.
  - name: API Keys
    description: API key management — create, list, revoke.
  - name: Webhooks
    description: Signed outbound event delivery — subscribe, list, remove, test.
  - name: Plugins
    description: >-
      Signed product-group plugin hot-install — verify, persist, hot-swap
      (admin-only).
  - name: Ruleset
    description: >-
      Compliance Current — the signed, versioned ruleset channel. Re-read it and
      hot-swap a verified bundle without a node restart (admin-only).
  - name: Node
    description: >-
      Node setup state, and what credential the caller presented. `/whoami`
      reports only what the request already carried; it is not a lookup.
  - name: Public (Vault)
    description: Unauthenticated vault endpoints for inter-service communication.
  - name: Credentialed Access
    description: >-
      Audience-scoped passport reads authenticated by a verifiable credential
      rather than an API key — repairers, market-surveillance authorities.
      Deliberately outside both `/public` (a public URL whose body varies by
      caller breaks caching and the meaning of `publicJwsSignature`) and
      `/api/v1` (API keys are the operator's own machine access; a repairer or
      authority holds a credential and no key).
  - name: Vault (internal)
    description: mTLS service-to-service telemetry ingestion (resolver → vault only).
  - name: Integrator
    description: >-
      CSV/XLSX bulk import — product groups, their versioned JSON Schemas,
      templates, upload, and async job polling.
  - name: Identity
    description: >-
      Public did:web identity — DID document, health, readiness. On the fused
      node these are served under `/identity/*`. The standalone identity service
      (:8002) serves them at the root — `/health`, `/ready`,
      `/.well-known/did.json`.
  - name: Identity (internal)
    description: >-
      mTLS service-to-service signing/rotation. **Not exposed by the fused
      node**, which signs in-process — reachable only on the standalone identity
      service, and only from a client presenting `CN=odal-vault`.
  - name: Public Resolver
    description: Unauthenticated public endpoints for QR scan resolution.
  - name: Health
    description: >-
      Health and readiness probes, plus the vault's build metadata — every
      deployable's unauthenticated liveness surface in one place.
