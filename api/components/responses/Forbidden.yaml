description: |
  The credential is authenticated but lacks the required scope — e.g. a
  `write`/`read` key attempting an admin-only action (registry identity).
content:
  application/problem+json:
    schema:
      $ref: ../schemas/errors/Problem.yaml
    example:
      type: https://problems.odal-node.io/forbidden
      title: Forbidden
      status: 403
      detail: Registry-identity management requires an admin-scoped credential.
