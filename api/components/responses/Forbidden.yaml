description: |
  The credential is authenticated but lacks the required scope — e.g. a
  `write`/`read` key attempting an admin-only action.

  Every scope refusal in the service answers this one sentence, naming the scope
  required rather than the route. The route is what the caller just addressed;
  the scope is the part they have to act on.
content:
  application/problem+json:
    schema:
      $ref: ../schemas/errors/Problem.yaml
    example:
      type: https://problems.odal-node.io/forbidden
      title: Forbidden
      status: 403
      detail: This operation requires an admin-scoped credential.
