type: object
required:
  - did
  - name
  - role
  - country
description: >-
  An economic operator responsible for a DPP (ESPR "responsible economic
  operator").
properties:
  did:
    type: string
    example: did:web:acme.example.com
  name:
    type: string
  role:
    $ref: ./OperatorRole.yaml
  euOperatorId:
    type:
      - string
      - 'null'
    description: EU-assigned economic operator identifier, if available.
  euOperatorIdScheme:
    type:
      - string
      - 'null'
    description: Scheme euOperatorId is expressed in — "vat", "lei", "eori", "duns".
  registeredTradeName:
    type:
      - string
      - 'null'
    description: >-
      Registered trade name or trade mark, where it differs from `name`.
    example: Nordwerk
  postalAddress:
    type:
      - string
      - 'null'
    description: >-
      Postal address at which the operator can be contacted. Distinct from
      `country`, which is the establishment country the registry matches on.
    example: Hauptstrasse 1, 10115 Berlin, DE
  electronicAddress:
    type:
      - string
      - 'null'
    description: >-
      Electronic means of contact — an email address or a contact URL.
    example: compliance@nordwerk.example
  country:
    type: string
    pattern: '^[A-Z]{2}$'
    description: |
      ISO 3166-1 alpha-2 country code of the operator's establishment, upper
      case.

      Checked against the assigned ISO 3166-1 list on
      `POST /dpp/{dppId}/transfer/initiate`, not merely shaped — `de` and `XX`
      are both refused with `422`. Canonical form is required rather than
      normalised because both operators are inside the payload this node signs,
      and upper-casing a caller's value before signing would sign something they
      did not send.
    example: DE
