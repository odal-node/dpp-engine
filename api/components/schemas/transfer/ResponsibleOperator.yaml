x-tags:
  - Transfer of Responsibility
type: object
required:
  - did
  - name
  - role
  - country
description: >-
  An economic operator responsible for a DPP (ESPR "responsible economic
  operator").
properties:
  did:
    type: string
    example: did:web:acme.example.com
  name:
    type: string
  role:
    $ref: ./OperatorRole.yaml
  euOperatorId:
    type:
      - string
      - 'null'
    description: EU-assigned economic operator identifier, if available.
  euOperatorIdScheme:
    type:
      - string
      - 'null'
    description: Scheme euOperatorId is expressed in — "vat", "lei", "eori", "duns".
  country:
    type: string
    minLength: 2
    maxLength: 2
    description: ISO 3166-1 alpha-2 country code of the operator's establishment.
