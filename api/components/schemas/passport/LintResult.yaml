x-tags:
  - Passport
type: object
description: >-
  Non-binding plausibility findings — arithmetic and physical-plausibility
  checks, distinct from binding compliance rules. Never gates publish, and may
  be recomputed at any time after publish via `POST /dpp/{dppId}/lint` (unlike
  `complianceResult`, which is frozen into the signed payload).
required:
  - packVersion
  - assessedAt
properties:
  packVersion:
    type: string
    description: Version of the lint pack that produced these findings.
    example: 1.0.0
  findings:
    type: array
    items:
      $ref: ./LintFinding.yaml
  assessedAt:
    type: string
    format: date-time
