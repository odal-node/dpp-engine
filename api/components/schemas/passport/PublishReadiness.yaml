type: object
description: |
  Whether the passport would clear the publish gates that can be answered
  without attempting the transition: the category **mandatory-content** gate and
  the product-group data/schema gates.

  Deliberately not the whole of publish. The registry-identity requirement is
  operator state rather than passport state, and the binding-compliance gate
  needs a determination this route does not run — so `ready: true` means "these
  gates pass", not "publish will certainly succeed".

  The mandatory-content half is the reason this exists. It is the gate that most
  often refuses a battery (38 fields for an electric-vehicle one) and it could
  not previously be previewed anywhere: it is reachable only from a stored
  passport, and the only dry-run the API offered takes an unsaved request body.
required:
  - ready
  - blockers
  - passportScope
properties:
  ready:
    type: boolean
    description: True when no blocker below applies.
  blockers:
    type: array
    description: Every blocking field, named individually. Empty when `ready`.
    items:
      $ref: PublishBlocker.yaml
  passportScope:
    $ref: PassportScopeReport.yaml
