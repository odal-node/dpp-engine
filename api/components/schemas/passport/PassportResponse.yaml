x-tags:
  - Passport
type: object
description: >-
  The canonical Digital Product Passport record. Fields marked required are
  emitted on every read; the rest are omitted when unset rather than sent as
  null, so a consumer must treat absence and null as the same thing.
required:
  - id
  - productName
  - productGroup
  - manufacturer
  - materials
  - status
  - schemaVersion
  - createdAt
  - updatedAt
  - retentionLocked
  - version
properties:
  id:
    $ref: ./DppId.yaml
  batchId:
    type:
      - string
      - 'null'
  productName:
    type: string
    example: EcoCell Pro 48V
  productGroup:
    type: string
    description: >-
      EU ESPR product group — the delegated-act bucket selecting the applicable schema
      and plugin. Deliberately an open string, not a closed enum: adding a
      product group is a catalog manifest plus a schema, not a release, and a
      product group this build does not know still round-trips its wire tag verbatim.
    example: battery
  applicableInstruments:
    type: array
    description: >-
      The legal instruments this passport was issued under, fixed when the
      product was placed on the market and never recomputed afterwards.


      A set rather than a single value because acts accumulate: ESPR Art. 5(7)
      lets a group-specific delegated act supplement a horizontal one and the
      Regulation states no precedence rule, so the governing law is the union of
      the members' requirements.


      Not derivable from `productGroup`. A horizontal act can reach a product
      whose product group is not one the catalog models, so an entry may be
      asserted by the economic operator rather than resolved from the catalog —
      which `recorded` distinguishes. Read it as who asserted the entry, not as
      how much to trust it.
    items:
      $ref: ./InstrumentRef.yaml
  granularity:
    $ref: ./Granularity.yaml
    description: >-
      The level this passport describes. Omitted entirely while no adopted act
      has fixed one — see `Granularity` for why omitted is not `item`.
  manufacturer:
    $ref: ./ManufacturerInfo.yaml
  materials:
    type: array
    items:
      $ref: ./MaterialEntry.yaml
  co2ePerUnit:
    description: >-
      CO₂e per unit — manufacturer-supplied or engine-calculated. An object, not
      a bare number: a figure without its lifecycle stage and system boundary is
      not comparable to another product's.
    anyOf:
      - $ref: ./CarbonFootprint.yaml
      - type: 'null'
  repairabilityScore:
    description: Non-regulatory repairability heuristic — see the schema's own note.
    anyOf:
      - $ref: ./RepairabilityScore.yaml
      - type: 'null'
  complianceResult:
    allOf:
      - $ref: ./ComplianceResult.yaml
    description: >-
      The computed compliance determination, attached at create/update. Part of
      the signed payload and immutable after retention lock. Absent until a
      determination has been computed.
  lintResult:
    allOf:
      - $ref: ./LintResult.yaml
    description: >-
      Advisory plausibility findings. Absent until a lint pass has run, and
      recomputable after publish — unlike `complianceResult`.
  productGroupData:
    description: >-
      Explicitly `null` — not omitted — for a passport whose product group data has not
      been supplied yet, which is every draft created without it. The field has
      no `skip_serializing_if`, so it is always present on the wire.
    anyOf:
      - $ref: ./ProductGroupData.yaml
      - type: 'null'
  status:
    $ref: ./PassportStatus.yaml
  qrCodeUrl:
    type:
      - string
      - 'null'
    format: uri
    description: >-
      GS1 Digital Link the carrier (QR) encodes, set on publish:
      {resolverBase}/01/{gtin}/21/{serial} for a trade item, else
      {resolverBase}/dpp/{id}. resolverBase is per-deployment
      (RESOLVER_BASE_URL, default https://id.odal-node.io).
  jwsSignature:
    type:
      - string
      - 'null'
    description: >-
      Compact JWS (Ed25519) over the **full** canonical payload. Null until
      published.
  publicJwsSignature:
    type: string
    description: >-
      Compact JWS over the **public (redacted) view**, so anyone can verify the
      public passport independently — the resolver checks this on the
      unauthenticated public route. Set at publish; absent for drafts.
  disclosureSignatures:
    type: object
    additionalProperties:
      type: string
    description: >-
      Compact JWS signatures over the **non-public** redacted views, keyed by
      disclosure set (e.g. `public+restricted+individual`), never by audience
      name. Every audience receiving more than the public view needs a proof
      over *its* view: `publicJwsSignature` covers only the public payload and
      `jwsSignature` only the full one, so a reader handed a filtered body and
      either of those holds a signature that cannot verify against the bytes it
      received. Empty for drafts.
  createdAt:
    type: string
    format: date-time
  updatedAt:
    type: string
    format: date-time
  publishedAt:
    type:
      - string
      - 'null'
    format: date-time
  placedOnMarketDate:
    type: string
    format: date
    description: >-
      The date the product was placed on the EU market — the regulated
      triggering event fixing **which law governs it**, distinct from the three
      lifecycle dates above, none of which selects a rule. Staged EU obligations
      attach at placing on the market and do not move afterwards. Absence means
      the date was not declared; it is **not** licence to substitute the current
      date, and a determination depending on it has no answer.
  schemaVersion:
    type: string
    description: >-
      Semantic version of the **product group** schema `productGroupData` was validated
      against. Scoped to `productGroupData` only — the envelope fields have no
      equivalent version and never will, because they are shared by every
      product group's stored documents. The envelope's compatibility rule is additive
      only, permanently.
    example: 1.0.0
  retentionLocked:
    type: boolean
    description: |
      Set to `true` permanently on first publish. Retention-locked
      passports must remain accessible for the EU ESPR retention period.
  version:
    type: integer
    minimum: 1
    description: >-
      Monotonic version counter. `1` on first publish; incremented on the
      successor each time a new version supersedes this record.
  supersedesId:
    allOf:
      - $ref: ./DppId.yaml
    description: The passport this record supersedes. Absent for first versions.
  parentPassportRef:
    allOf:
      - $ref: ./PassportRef.yaml
    description: >-
      Cross-operator reference to the predecessor this passport derives from
      (second-life successor linkage).
  componentRefs:
    type: array
    description: >-
      Cross-operator references to the constituent passports this product is
      assembled from — its bill of materials. The inverse edge of
      `parentPassportRef`: these point down to many constituents, that points up
      to one predecessor.
    items:
      $ref: ./PassportRef.yaml
  retentionUntil:
    type: string
    format: date-time
    description: >-
      Deadline by which this record must remain accessible, computed at publish
      from the product group's retention period. Regulation (EU) 2024/1781 Art. 9(2)(i)
      requires the delegated act to specify a period corresponding to at least
      the product's expected lifetime; Art. 11(e) restates it as an essential
      requirement, available including after the responsible operator's
      insolvency, liquidation or cessation of activity.
  productId:
    type: string
    format: uuid
    description: >-
      Opaque link to an internal product-template record. Not a legal
      identifier.
  commodityCode:
    type: string
    description: >-
      Customs tariff classification — HS-6, CN-8 or TARIC-10. Absent where the
      product group does not call for one; this node will not invent a
      classification it cannot derive.
    example: '85076000'
  operatorIdentifier:
    type: string
    description: >-
      EORI or national economic-operator identifier for the responsible party
      (Regulation (EU) 2024/1781 Annex III(k); issuance mechanics in Art. 12).
      **Frozen at publish — this is the operator that published the passport,
      not necessarily the one responsible for it now.** A transfer of
      responsibility does not rewrite it and cannot: published content is
      immutable and covered by the signature over it. For current
      responsibility, read the transfer chain.
    example: DE123456789
  facility:
    allOf:
      - $ref: ./FacilitySnapshot.yaml
    description: >-
      Snapshot of the Annex III facility where this product was manufactured or
      processed, copied by value at create time.
  seal:
    allOf:
      - $ref: ./SealedEnvelope.yaml
    description: >-
      The eIDAS electronic seal applied to this passport. Absent until a seal
      has been applied; check its `placeholder` flag rather than inferring
      validity from presence.
