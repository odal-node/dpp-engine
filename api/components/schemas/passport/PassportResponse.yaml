allOf:
  - $ref: ./PassportProperties.yaml
  - required:
      - id
      - productName
      - productGroup
      - manufacturer
      - materials
      - status
      - schemaVersion
      - createdAt
      - updatedAt
      - retentionLocked
      - version
description: >-
  The canonical Digital Product Passport record, as the **authenticated** reads
  and writes serve it. Fields marked required are emitted on every such read;
  the rest are omitted when unset rather than sent as null, so a consumer must
  treat absence and null as the same thing.

  The routes that serve a redacted view (the public reads, the audience-scoped
  credential read and the resolver) answer with `RedactedPassportResponse`
  instead, because a redaction removes fields this schema requires.
