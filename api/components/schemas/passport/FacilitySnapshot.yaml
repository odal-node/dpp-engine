type: object
description: >-
  Annex III facility details copied by value into the passport at create time.
  Self-contained on purpose: the signed passport stays a complete record even
  after the operator retires the facility from their mutable registry.
required:
  - scheme
  - value
  - name
  - country
properties:
  scheme:
    type: string
    example: gln
  value:
    type: string
    example: '4012345000009'
  name:
    type: string
  country:
    type: string
    pattern: '^[A-Z]{2}$'
    description: |
      ISO 3166-1 alpha-2 country code, upper case.

      Copied from a facility whose country was validated against the ISO
      3166-1 list when it was registered, so this is what the server emits
      rather than merely what it hopes for.
  address:
    type: string
