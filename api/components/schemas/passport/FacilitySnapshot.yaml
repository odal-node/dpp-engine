x-tags:
  - Passport
type: object
description: >-
  Annex III facility details copied by value into the passport at create time.
  Self-contained on purpose: the signed passport stays a complete record even
  after the operator retires the facility from their mutable registry.
required:
  - scheme
  - value
  - name
  - country
properties:
  scheme:
    type: string
    example: gln
  value:
    type: string
    example: '4012345000009'
  name:
    type: string
  country:
    type: string
    minLength: 2
    maxLength: 2
    description: ISO 3166-1 alpha-2 country code.
  address:
    type: string
