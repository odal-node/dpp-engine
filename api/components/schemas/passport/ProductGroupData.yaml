type: object
description: |
  Product group-specific data, **internally tagged** by a `productGroup`
  discriminator: e.g.
  `{ "productGroup": "battery", "productIdentifier": { "scheme": "gs1", "gtin": "…" }, "batteryChemistry": "LFP", … }`.
  The remaining fields are product group-specific and validated against the
  product group's versioned JSON schema. Product groups include `battery`, `textile`,
  `steel`, `aluminium`, `tyre`, `electronics`, and others.

  The tag is **open**. A product group this build does not model round-trips its
  tag and payload verbatim instead of failing to parse, so a group added to the
  catalog does not require a client release. That is why the server does not
  derive this shape with `#[serde(tag = …)]`, which would close the set at
  compile time.
required:
  - productGroup
allOf:
  - if:
      properties:
        productGroup:
          const: battery
      required:
        - productGroup
    then:
      required:
        - batteryType
      properties:
        batteryType:
          type: string
          minLength: 1
  - if:
      properties:
        productGroup:
          const: toy
      required:
        - productGroup
    then:
      required:
        - ageGroup
      properties:
        ageGroup:
          type: string
          minLength: 1
discriminator:
  propertyName: productGroup
properties:
  productGroup:
    type: string
    example: battery
  batteryType:
    type: string
    minLength: 1
  ageGroup:
    type: string
    minLength: 1
additionalProperties: true
example:
  productGroup: battery
  productIdentifier:
    scheme: gs1
    gtin: '09506000134352'
  batteryType: industrial
  batteryChemistry: LFP
  nominalVoltageV: 48
  nominalCapacityAh: 100
  expectedLifetimeCycles: 3000
  co2ePerUnitKg: 45.2
