type: object
description: >-
  An eIDAS electronic seal over the passport's full-payload signature. Check
  `placeholder` before treating it as evidence — a placeholder envelope is
  produced when no QTSP is configured and carries no legal validity.
required:
  - format
  - sealValue
  - sealedAt
  - placeholder
properties:
  format:
    $ref: ./SealFormat.yaml
  sealValue:
    type: string
    description: Base64-encoded seal value as returned by the QTSP.
  signingCertRef:
    type: string
    description: Reference to the signing certificate chain.
  conformanceLevel:
    allOf:
      - $ref: ./SealConformanceLevel.yaml
    description: >-
      The baseline level this seal was **requested** at.

      A record of what was asked for, not proof of what arrived — the same
      standing as `signingCertRef`, which names the certificate the seal claims
      rather than one anybody verified. What the bytes actually carry is read out
      of the envelope by a validator, and the two agreeing is the cross-check.

      Absent means **not recorded** — an envelope written before this field
      existed, or a seal restored from a backup or produced elsewhere. It never
      means the level was low.
  sealedAt:
    type: string
    format: date-time
  placeholder:
    type: boolean
    description: >-
      `true` when this envelope has **no** legal validity. Consumers must check
      this flag rather than inferring validity from the envelope's presence.
