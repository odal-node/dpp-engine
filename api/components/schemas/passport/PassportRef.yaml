type: object
required:
  - uri
  - publicJwsHash
description: >-
  A cross-operator reference to another passport: where to fetch it, and the
  lowercase-hex SHA-256 of that passport's public JWS, which pins the exact
  signed public view expected there.
properties:
  uri:
    type: string
    format: uri
    description: Resolvable https URI of the referenced passport.
    example: https://id.other-operator.example/dpp/0191b2c3-d4e5-7f80
  publicJwsHash:
    type: string
    pattern: ^[0-9a-f]{64}$
    description: Lowercase hex SHA-256 of the referenced passport's public JWS.
