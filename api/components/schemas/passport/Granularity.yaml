x-tags:
  - Passport
type: string
enum:
  - model
  - batch
  - item
description: |
  The level a passport is issued at.

  Set by the applicable delegated act (ESPR Art. 9(2)(d)), so it is a property
  of the law rather than a choice made here, and unset while no adopted act has
  fixed one — which is every product group today.

  Unset is not `item`: the EU registry registers batteries per item, but that is
  the registry's operational position, not a level any act has set.

  One schema serves both the level a passport records and the level an act
  fixes, because those are the same enumeration in the code. They were written
  out twice, which made them two things to drift and left neither checked
  against the code that emits them.
example: item
