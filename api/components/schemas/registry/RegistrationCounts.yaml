type: object
required:
  - pending
  - submitted
  - registered
  - rejected
  - abandoned
  - deactivated
  - statusIntents
  - stalled
  - unregisteredPublished
properties:
  pending:
    type: integer
  submitted:
    type: integer
  registered:
    type: integer
  rejected:
    type: integer
  abandoned:
    type: integer
    description: >-
      Rows an operator gave up on after the registry was shown to hold nothing
      for them: published passports that will not be registered. Counted so they
      are not read as still owed.
  deactivated:
    type: integer
  statusIntents:
    type: integer
    description: Status changes owed to the registry that nothing drains.
  stalled:
    type: integer
    description: Rows that have retried past the point of self-recovery.
  unregisteredPublished:
    type: integer
    description: >-
      Published passports with **no** outbox row at all — they owe a
      registration nobody is tracking (published before the outbox existed, or
      lost to an older write path). Reported, not repaired: the queued payload
      is what a drain replays and there is none to rebuild, so fabricating a row
      would create an entry that can never drain.
