type: object
description: >-
  Operator-wide EU-registry state. `configured: false` means this deployment has
  no registry queues; the counts are then omitted rather than reported as zero.
required:
  - configured
  - verification
properties:
  configured:
    type: boolean
  verification:
    $ref: ./VerificationView.yaml
  registrations:
    $ref: ./RegistrationCounts.yaml
  transfers:
    $ref: ./TransferCounts.yaml
