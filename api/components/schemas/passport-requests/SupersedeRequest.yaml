type: object
description: |
  Which passport replaces the one being retired.

  Supersession is a **link between two passports that already exist**, not a
  create-and-retire in one call: a successor is an ordinary passport with its own
  content and its own publish gates, so it goes through the normal create and
  publish routes and is only then named here.

  For the other direction — correcting a published passport, where the successor
  is derived from the record it replaces — use `POST /dpp/{dppId}/amend`, which
  mints the successor itself and cannot name one that already exists.
required:
  - supersededBy
properties:
  supersededBy:
    allOf:
      - $ref: ../passport/DppId.yaml
    description: |
      The successor, which must already be **published** and must already carry
      `supersedesId` pointing back at the passport named in the path. That link
      is set when the successor is created; this call confirms the two agree
      before retiring anything, and refuses with `422` if they do not.
  reason:
    type: string
    description: |
      Why the passport is being retired. Stored on the predecessor's audit entry
      alongside the successor's id — the same entry `amend` writes, so a reader
      arriving at a retired record finds what replaced it and why, whichever
      route retired it.
    example: Reissued on schema 2.6.0 after the product group's lens changed
