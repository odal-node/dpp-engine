type: object
required:
  - category
description: >-
  A recognised derogation from the ESPR Art. 25 destruction ban. The category
  list is fixed by the applicable delegated act; validated against that list at
  the engine boundary, not by this schema.
properties:
  category:
    type: string
    description: |
      One of the points of Art. 2 of Commission Delegated Regulation (EU)
      2026/296, spelled as the unsold-goods disclosure spells a discard reason
      (camelCase), such as `dangerousProduct` for point (a). Any other value is
      refused with `422`, and the refusal lists them all.
    example: dangerousProduct
  actCitation:
    type:
      - string
      - 'null'
    description: The act/article this derogation is grounded in (e.g. an OJ/CELEX ref).
