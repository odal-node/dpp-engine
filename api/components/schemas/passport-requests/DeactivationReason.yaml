description: >-
  Why a passport reached end-of-life, internally tagged by `kind`. A destruction
  that the ESPR Art. 25(1) ban reaches cites a `derogation`, its lawful basis.
oneOf:
  - type: object
    required:
      - kind
    properties:
      kind:
        type: string
        enum:
          - recycled
  - type: object
    required:
      - kind
    properties:
      kind:
        type: string
        enum:
          - destroyed
      derogation:
        $ref: ./Derogation.yaml
  - type: object
    required:
      - kind
    properties:
      kind:
        type: string
        enum:
          - exported
  - type: object
    required:
      - kind
    properties:
      kind:
        type: string
        enum:
          - lost
example:
  kind: recycled
