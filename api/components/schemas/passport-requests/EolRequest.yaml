type: object
required:
  - reason
description: Request body for declaring a passport end-of-life.
properties:
  reason:
    $ref: ./DeactivationReason.yaml
  unsold:
    type:
      - boolean
      - 'null'
    description: >-
      Whether the product was an unsold consumer product, which a passport does
      not record. Required with a `destroyed` reason (`422` otherwise): with the
      operator's `enterpriseSize` it decides whether the ESPR Art. 25(1) ban
      reaches the product, and so whether the destruction cites a derogation.
  declaredBy:
    type:
      - string
      - 'null'
    description: DID of the declaring operator; defaults to the authenticated actor.
  materialRecovery:
    type:
      - object
      - 'null'
    description: |
      Optional recovered-material summary (Battery Annex XIII circularity).
      A number dpp-core cannot hash exactly, such as an integer too large for a
      double to hold, is refused with `422` naming `/materialRecovery`.
  notes:
    type:
      - string
      - 'null'
