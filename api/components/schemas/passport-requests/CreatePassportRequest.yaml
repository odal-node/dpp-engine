type: object
required:
  - productName
  - manufacturer
description: |
  Request body for creating a new DPP. Only `productName` and
  `manufacturer` are required. All other fields are optional and
  can be filled in later via `PUT` before publishing.
properties:
  productName:
    type: string
    description: Human-readable product name. Must not be blank.
    example: EcoCell Pro 48V
  productGroup:
    type: string
    description: |
      EU ESPR product group (the dispatch key), e.g. `battery`, `textile`,
      `electronics`. Optional — derived from `productGroupData` when omitted.
    example: battery
  manufacturer:
    $ref: ../passport/ManufacturerInfo.yaml
  materials:
    type: array
    items:
      $ref: ../passport/MaterialEntry.yaml
  co2ePerUnit:
    type: number
    minimum: 0
    description: >-
      CO₂ equivalent per unit, in kg. Must be finite and non-negative;
      anything else is rejected with `422`.

      Supplied here as a scalar and stored as a `CarbonFootprint` object, so the
      value echoed back on `PassportResponse` is `{ "valueKg": … }` rather than
      the bare number sent. The lifecycle stage and system boundary that make
      two figures comparable cannot be set through this route.
    example: 4.2
  repairabilityScore:
    type: number
    minimum: 0
    maximum: 10
    description: >-
      Non-regulatory repairability heuristic, **0–10**. Not EN 45554 or EU
      2023/1669 — those have prescribed methodologies this does not implement.
      Anything outside 0–10 is rejected with `422`.

      Supplied here as a scalar and stored as a `RepairabilityScore` object, so
      the value echoed back on `PassportResponse` is `{ "overall": … }` rather
      than the bare number sent.
    example: 7.5
  productGroupData:
    description: >-
      Optional at create; an explicit `null` is accepted and equivalent to
      omitting it. Publish validates it only when present.
    anyOf:
      - $ref: ../passport/ProductGroupData.yaml
      - type: 'null'
  batchId:
    type: string
    description: Optional batch or lot identifier
    example: BATCH-2026-04-001
  placedOnMarketDate:
    type: string
    format: date
    description: |
      The date this product was placed on the EU market — the regulated
      triggering event that fixes which law governs it.

      Optional, and omitting it is not neutral. A compliance determination
      whose rule is phased by date has no answer without it: the node
      reports the missing fact rather than substituting today's date, which
      would produce a determination that silently changes its own answer
      when a phase begins. For batteries this decides which EU 2023/1542
      Art. 8 minimum recycled shares apply.
    example: '2026-03-14'
  schemaVersion:
    type: string
    description: |
      Product group schema version. Optional, and the only accepted value is the
      product group's **current** version — omitting it is equivalent. Any other
      value is rejected with `422`.

      It is not the caller's to choose: the stored version selects the
      disclosure table the passport's public view is filtered through and
      signed under, and an older table classifies fewer fields, defaulting
      the rest to public. The body is validated against the current schema
      in either case, so a differing declaration is already false about the
      body it accompanies.
    example: 2.6.0
  derivedFrom:
    type: array
    items:
      $ref: ../passport/DerivationRef.yaml
    description: >-
      Cross-operator predecessors this passport derives from (second-life
      successor linkage), each naming the operation that produced this unit from
      it. A list rather than the single `parentPassportRef` it replaces, because
      Regulation (EU) 2023/1542 Art. 77(7) permits several predecessors.
  lifeStatus:
    allOf:
      - $ref: ./CreateLifeStatus.yaml
    description: >-
      Where this unit sits in its **product** life — Annex XIII point 4(c) of
      Regulation (EU) 2023/1542.


      Orthogonal to `status`, which is the *publication* lifecycle: a
      `repurposed` unit's passport is `active` like any other. Omit it for any
      product group but battery — only Reg. (EU) 2023/1542 defines this
      vocabulary, and a textile passport asserting `original` would be borrowing
      a battery term for a question its own instrument does not ask. Sending it
      for another product group is refused.


      **This is the only way to set it.** `lifeStatus` is protected from
      patching, because it is part of a body that gets signed and rewriting it
      after publication would change what a proof covers.


      🚨 **`waste` is refused here.** The other four describe how a unit came to
      be, and Art. 77(7) makes each operation produce a *new* passport — so a
      repurposed unit is created as `repurposed`. `waste` is the one value that
      happens to a record which continues, and under that article's second
      subparagraph it moves responsibility as well, so it belongs to a versioning
      event on the passport becoming waste rather than to the creation of a new
      one.


      Omitting it is lawful everywhere. For a battery it reads as *not stated*
      rather than *not applicable*, and publish does not refuse it — the lint
      result says so instead, because a default would put a claim about a unit
      onto a record that is about to be signed.
  componentRefs:
    type: array
    items:
      $ref: ../passport/ComponentRef.yaml
    description: >-
      Cross-operator references to this product's constituent passports (its
      bill of materials), each optionally qualified by how much and in what
      role. Local cycles / over-depth are refused at create/update; immutable
      after publish.
  commodityCode:
    type: string
    description: >-
      Customs tariff classification — HS-6, CN-8 or TARIC-10 (6, 8 or 10 digits,
      no separators). Registration data the EU registry verifies against the
      ranges its product group permits.
    example: '85076000'
  supersedesId:
    allOf:
      - $ref: ../passport/DppId.yaml
    description: |
      The passport this one replaces, if it is a new version of an existing
      record.

      Declared here because `supersedesId` is protected: it is set by the write
      that creates the whole record, never by a field patch. Recording the link
      retires nothing — the predecessor is retired by
      `POST /dpp/{dppId}/supersede` once this successor is published, and that
      route checks the two agree.

      Only for a successor created independently. `POST /dpp/{dppId}/amend`
      mints its own successor and sets this field itself; it is not settable
      through that route and does not need to be.
