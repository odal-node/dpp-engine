type: object
required:
  - operator_id
  - jws
  - payload
description: Internal verification request. Field names are snake_case (internal contract).
properties:
  operator_id:
    type: string
    description: Operator id whose key the signature is checked against.
    example: self_hosted
  jws:
    type: string
    description: The compact JWS to verify.
  payload:
    description: The payload the caller expects the JWS to have been signed over.
