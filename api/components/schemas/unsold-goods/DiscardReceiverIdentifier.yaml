type: object
description: EUID or an identifier from a recognised Member State scheme.
oneOf:
  - required:
      - type
      - value
    properties:
      type:
        const: euid
      value:
        type: string
        minLength: 1
    additionalProperties: false
  - required:
      - type
      - scheme
      - value
    properties:
      type:
        const: other
      scheme:
        type: string
        minLength: 1
      value:
        type: string
        minLength: 1
    additionalProperties: false