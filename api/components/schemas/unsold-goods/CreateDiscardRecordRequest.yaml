type: object
description: |
  One discard of unsold consumer products, and the passports of the units it
  discards.

  `record` is checked as sent, against dpp-core's discard-record schema, before
  it is read. A field that schema does not have is refused, not dropped. The
  embedded `DiscardRecord` contract mirrors dpp-core schema v1.0.0; the response
  reports the version the node checks against as `schemaVersion`.
required:
  - record
additionalProperties: false
properties:
  record:
    $ref: ./DiscardRecord.yaml
  passportIds:
    type: array
    description: |
      The passports of the units this discard discards. A join in this node's
      storage, not part of the record. Duplicates are stored once.
    items:
      type: string
      format: uuid
