type: object
description: |
  A self-contained, signed snapshot of a passport's full proof chain,
  persisted by the node at generation time. Verification
  (`POST /evidence/{id}/verify`) is an integrity check of the stored
  dossier against its own signatures and hash chains. See
  `docs/architecture/EVIDENCE-DOSSIER.md` for the full specification,
  including why `calcReceipts`/`checkpoint` are always empty/`null` in
  format v1.
required:
  - manifest
  - manifestJws
  - fullView
  - publicView
  - didDocuments
  - auditEntries
properties:
  manifest:
    $ref: ./DossierManifest.yaml
  manifestJws:
    type: string
  fullView:
    $ref: ./SignedLayer.yaml
  publicView:
    $ref: ./SignedLayer.yaml
  didDocuments:
    type: object
    description: DID document snapshots, keyed by DID.
    additionalProperties:
      type: object
  auditEntries:
    type: array
    items:
      $ref: ./AuditEntry.yaml
  transferChain:
    type:
      - object
      - 'null'
    description: Present iff the passport has ever changed responsible operator.
  eolEvent:
    type:
      - object
      - 'null'
    description: Present iff the passport was declared end-of-life.
  checkpoint:
    type:
      - object
      - 'null'
    description: Always `null` in format v1 — the signed-checkpoint layer is not yet built.
  calcReceipts:
    type: array
    description: >-
      Always empty in format v1 — `dpp-calc` invocation is not yet wired end to
      end.
    items:
      type: object
  componentGraph:
    anyOf:
      - $ref: ./TreeReport.yaml
      - type: 'null'
    description: |
      The recursive component-tree (bill-of-materials) verification report,
      present iff the passport declares `componentRefs`. `null` for a unit
      with no modelled sub-assemblies.

      Generated at dossier-assembly time by walking the tree and pin-checking
      each node, then bound into `contentHashes` like every other member — so
      a tampered report fails the dossier's `content_integrity` check rather
      than passing as an unverifiable attachment.

      Integrity only, the same caveat as the standalone `verify-tree` route:
      it proves each node's signed public view is unchanged against its
      pinned hash, not the cryptographic validity of that node's signature.
  qualifiedSeal:
    type:
      - object
      - 'null'
    description: |
      The passport's eIDAS qualified seal, present iff one has been
      applied. Carries the seal envelope plus `signedOverJws` and
      `payloadHash`, so a verifier holding only this dossier has both the
      CAdES and the preimage to check it against.

      Included because a dossier is what an authority is handed and the
      seal is its one member carrying an Art. 35(2) presumption — and
      because it is unreachable otherwise: the seal is stripped from
      `fullView` and `publicView` alike, since it covers the full-payload
      signature rather than any redaction. Bound into `contentHashes` like
      every other member. `null` when the seal is still queued.
    properties:
      seal:
        type: object
        description: The `SealedEnvelope` as persisted on the passport.
      signedOverJws:
        type: string
      payloadHash:
        type: string
        pattern: ^[0-9a-f]{64}$
