type: object
required:
  - id
  - operatorId
  - entityType
  - entityId
  - action
  - actor
  - ts
description: >-
  An immutable audit record for a registry-identity mutation (a facility per
  Annex III or an operator identifier per Art. 13). Append-only.
properties:
  id:
    type: string
    format: uuid
  operatorId:
    type: string
  entityType:
    type: string
    enum:
      - facility
      - operator_identifier
  entityId:
    type: string
    format: uuid
  action:
    type: string
    enum:
      - added
      - retired
      - set_default
      - set_primary
  actor:
    type: string
    description: user_id of the actor who performed the change.
  snapshot:
    type:
      - object
      - 'null'
    description: The full record at the time of the action, for reconstruction.
  ts:
    type: string
    format: date-time
