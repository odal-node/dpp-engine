x-tags:
  - Operator Profile
type: object
required:
  - id
  - name
  - identifierScheme
  - identifierValue
  - country
  - isDefault
  - createdAt
description: A manufacturing/processing facility (ESPR Annex III).
properties:
  id:
    type: string
    format: uuid
  name:
    type: string
    example: München Cell Plant
  identifierScheme:
    type: string
    description: Identifier scheme, e.g. "gln" or "national".
    example: gln
  identifierValue:
    type: string
    example: '4012345000009'
  country:
    type: string
    minLength: 2
    maxLength: 2
    example: DE
  address:
    type:
      - string
      - 'null'
  isDefault:
    type: boolean
    description: The default facility is stamped onto new passports.
  createdAt:
    type: string
    format: date-time
