type: object
description: Merge-patch update. Supply only the fields being changed.
properties:
  legalName:
    type: string
  tradeName:
    type: string
  address:
    type: string
  country:
    type: string
  contactEmail:
    type: string
  didWebUrl:
    type: string
  productCategories:
    type: array
    items:
      type: string
  brandPrimary:
    type: string
  brandSecondary:
    type: string
  brandLogoUrl:
    type: string
  customDomain:
    type: string
  dataResidency:
    type: string
  retentionPolicyDays:
    type: integer
  featureFlags:
    type: object
  registryVerifiedAt:
    type:
      - string
      - 'null'
    format: date-time
    description: >-
      When this operator's identity was last verified against the EU registry.
      Null when no verification has succeeded; never treat absence as verified.
  enterpriseSize:
    description: >-
      The operator's enterprise size class, which decides whether the ESPR
      Art. 25(1) destruction ban reaches it. Omitted or null leaves the current
      value unchanged, so a size once stated is corrected by stating another.
      A node that has never been given one treats the operator as not exempt.
    anyOf:
      - $ref: ./EnterpriseSize.yaml
      - type: 'null'
