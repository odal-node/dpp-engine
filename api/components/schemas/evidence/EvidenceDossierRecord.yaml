type: object
description: A stored dossier snapshot — the dossier plus its persistence envelope.
required:
  - id
  - passportId
  - actor
  - createdAt
  - docHash
  - dossier
properties:
  id:
    type: string
    format: uuid
  passportId:
    type: string
    format: uuid
  actor:
    type: string
    description: Who requested generation.
  createdAt:
    type: string
    format: date-time
  docHash:
    type: string
    description: Hex SHA-256 of the JCS-canonicalised stored dossier document.
  dossier:
    $ref: ./EvidenceDossier.yaml
