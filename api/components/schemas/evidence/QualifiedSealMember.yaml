type: object
description: |
  The passport's eIDAS qualified seal as carried inside an evidence dossier:
  the seal envelope plus the JWS it was computed over and that payload's hash,
  so a verifier holding only the dossier has both the CAdES and the preimage to
  check it against.

  Included because a dossier is what an authority is handed, and the seal is its
  one member carrying an Art. 35(2) presumption — and because it is unreachable
  otherwise: the seal is stripped from `fullView` and `publicView` alike, since
  it covers the full-payload signature rather than any redaction. Bound into
  `contentHashes` like every other member.

  ⚠️ **This shape is described here but not enforced anywhere.** The field is
  held as untyped JSON on the dossier record, so no Rust type declares these
  members and the OpenAPI contract test has nothing to compare them against.
  Treat the property list as documentation of intent, not as a guarantee. Giving
  the dossier a real type for this member would close that, and is the only thing
  that would — and it is worth doing: this list had fallen five fields behind
  what the dossier actually carries before anyone read the two side by side.
properties:
  seal:
    type: object
    description: The `SealedEnvelope` as persisted on the passport.
  signedOverJws:
    type: string
    description: The JWS the seal was computed over.
  payloadHash:
    type: string
    pattern: ^[0-9a-f]{64}$
    description: SHA-256 of the sealed payload, lowercase hex.
  binding:
    $ref: ../seals/SealBinding.yaml
  validation:
    $ref: ../seals/SealValidationStatus.yaml
  certificate:
    oneOf:
      - $ref: ../seals/CertificateStanding.yaml
      - type: 'null'
  origin:
    oneOf:
      - $ref: ../seals/SealOrigin.yaml
      - type: 'null'
    description: >-
      What the seal's own certificate says about who issued it — the one fact
      that decides whether anything else in this member carries weight.
  evidencedLevel:
    type:
      - string
      - 'null'
    description: >-
      The baseline level the seal's **bytes** carry, which is not necessarily the
      level this node asked for. A seal weaker than ordered is otherwise visible
      only in a drain log no dossier reader has.
  attestedSealedAt:
    type:
      - string
      - 'null'
    format: date-time
    description: >-
      A timestamp authority's statement of when the seal was made, read out of
      the token inside the CAdES and checked. `seal.sealedAt` beside it is the
      sealing node's own clock, which is an unattested claim by the party that
      bought the seal.
  archival:
    $ref: ../seals/ArchivalFreshness.yaml
