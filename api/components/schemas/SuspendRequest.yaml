type: object
description: |
  Optional body for suspending a published passport.

  The body itself is optional — `POST` with no body suspends without a recorded
  reason. Where a reason is supplied it is appended to the audit entry, not
  stored on the passport, so it is not part of the signed document.
properties:
  reason:
    type: string
    description: Human-readable reason for the suspension, appended to the audit trail.
    example: Product recall — safety investigation pending
