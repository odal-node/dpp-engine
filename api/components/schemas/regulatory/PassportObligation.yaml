type: object
description: |
  Whether a passport is required for a product group, and from when.

  The obligation is split from its date so `required` can be answered where
  nothing fixes a date — which is most of the catalog.
properties:
  required:
    type: boolean
    description: |
      Whether an instrument recorded against this product group imposes a
      passport obligation. Says nothing about whether one can be produced today
      — see `determinable` on the enclosing object.

      **Read with `instruments[].bindingStatus`.** This is a fold across every
      reaching act, so `true` means an act imposes a passport, not that any act
      binds this group today.
    example: true
  from:
    anyOf:
      - $ref: ./ObligationDate.yaml
      - type: 'null'
    description: |
      The date the obligation applies from, or `null` where no instrument fixes
      one. An obligation with no date is not one starting today.
required:
  - required
  - from
