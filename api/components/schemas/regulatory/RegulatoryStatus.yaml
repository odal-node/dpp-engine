x-tags:
  - Regulatory Catalog
type: string
enum:
  - in_force
  - provisional
  - watch
description: |
  Whether an act's obligations bind **a given product group** — a different
  question from whether the act exists, which is `InstrumentStatus`.

  `in_force` — the act creates binding obligations for this product group that
  can be determined now. A future applicability date is *not* this status.

  `provisional` — the act exists or is anticipated, but nothing is bindingly
  determinable for this product group yet. Any obligation reported alongside
  this status is a reading, not a determination.

  `watch` — tracked, but this act imposes nothing on this product group. A
  watching brief rather than a duty, and never determinable.

  **Read this before acting on `passport.required`.** The obligation is a fold
  across every act reaching the product group, so `required: true` says an act
  imposes a passport — not that the act binds this group today. Where every
  reaching act is `provisional` or `watch`, the requirement is a reading of
  instruments that have not yet bound anything.
example: provisional
