x-tags:
  - Regulatory Catalog
type: object
description: |
  How long records must be kept, with the provenance of that figure.

  The figure is the maximum across every act reaching the product group, because
  retention periods are floors and a record kept long enough for the longest
  satisfies them all. The basis is `sourced` only when every contributing figure
  is sourced — one assumption anywhere makes the compound figure an assumption,
  whichever act supplied the maximum.
properties:
  years:
    type: integer
    minimum: 0
    description: Years the record must be kept.
    example: 10
  basis:
    $ref: ./RetentionBasis.yaml
    description: Whether this figure traces to an adopted text.
required:
  - years
  - basis
