type: string
enum:
  - adopted
  - proposed
  - anticipated
description: |
  How far through the legislative process an act is — whether the **act
  exists**, not whether it binds anything.

  `adopted` — adopted and published in the Official Journal, citable by CELEX.

  `proposed` — formally proposed but not adopted. Its text can be read and cited
  as a *proposal*, never as law.

  `anticipated` — announced in a working plan or otherwise expected, with no
  text to read. Such an act has no CELEX, and nothing derived from it may be
  presented as sourced.

  Distinct from `RegulatoryStatus`, and the distinction is easy to lose: an
  adopted act binds nothing until its own dates arrive, and routinely binds one
  product group while another waits. The practical case is that ESPR has been
  `adopted` since 2024 while every product group under it is still `provisional`
  — both statements are true and neither implies the other.
example: adopted
