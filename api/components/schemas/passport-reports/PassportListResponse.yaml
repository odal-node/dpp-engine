type: object
description: One page of passports, with the totals needed to page through them.
required:
  - dpps
  - total
  - limit
  - skip
properties:
  dpps:
    type: array
    items:
      $ref: ../passport/PassportResponse.yaml
  total:
    type: integer
    description: >-
      Total matching the filter across every page — deliberately not the length
      of `dpps`.
  limit:
    type: integer
    description: The page size actually applied, after clamping.
  skip:
    type: integer
    description: The offset this page starts at.
