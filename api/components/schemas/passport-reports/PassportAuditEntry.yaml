type: object
required:
  - id
  - passportId
  - actor
  - action
  - timestamp
properties:
  id:
    type: string
    format: uuid
  passportId:
    type: string
  actor:
    type: string
    example: admin@example.com
  action:
    type: string
    example: published
  previousStatus:
    type:
      - string
      - 'null'
  newStatus:
    type:
      - string
      - 'null'
  metadata:
    type:
      - object
      - 'null'
  timestamp:
    type: string
    format: date-time
  requestId:
    type:
      - string
      - 'null'
    description: >-
      The `x-request-id` of the HTTP request that produced this entry — the same
      value returned in that request's response header, so a support
      conversation can be traced from a client's log to the trail. Null for an
      entry written outside a request, and for every entry written before this
      field was populated.


      Deliberately **not** covered by `entryHash`: it describes the transport
      that carried the change, not the change, and folding it in would
      invalidate the chain of every entry already stored.
  prevHash:
    type:
      - string
      - 'null'
    description: >-
      Hex SHA-256 of the previous entry's `entryHash`, or null for the first
      entry in a passport's chain. Together with `entryHash` this makes the
      trail append-only and tamper-evident: recomputing the chain detects any
      inserted, removed or edited entry.
  entryHash:
    type:
      - string
      - 'null'
    description: >-
      Hex SHA-256 over this entry's canonical (RFC 8785) bytes including
      `prevHash`. Null only for entries written before the chain was
      introduced.
