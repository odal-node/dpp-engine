type: object
description: |
  RFC 7807 / RFC 9457 problem details. The shape
  `dpp-common::http_problem::Problem` produces, served as
  `application/problem+json`.

  `type` is derived from `title`, so each distinct `title` used across the
  codebase is a stable catalogue key that clients may depend on.
required:
  - type
  - title
  - status
properties:
  type:
    type: string
    format: uri
    description: Absolute URI identifying the problem type.
    example: https://problems.odal-node.io/not-found
  title:
    type: string
    description: Short human-readable summary of the problem type.
    example: Not Found
  status:
    type: integer
    description: The HTTP status code, mirroring the status line.
    example: 404
  detail:
    type: string
    description: Human-readable explanation for this specific occurrence.
    example: "No schema for product group 'nosuchgroup'. Known product groups: aluminium, battery."
  instance:
    type: string
    format: uri-reference
    description: URI reference identifying this specific occurrence.
  errors:
    type: array
    description: |
      The individual field failures behind this problem, when there are any.

      An RFC 7807 §3.2 extension member. `detail` carries the same failures
      joined with `"; "` and is unaffected, so a client written before this
      member existed keeps working; `errors` is what lets a newer one address a
      single field. Publishing a battery that is missing its Annex XIII content
      produces upwards of thirty entries here.

      Omitted entirely — never `[]` — on problems that are not about fields.
    items:
      $ref: ./ProblemFieldError.yaml
