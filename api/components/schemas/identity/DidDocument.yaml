type: object
description: |
  A W3C DID Core `did:web` document. Lists the operator's Ed25519
  verification methods as `JsonWebKey`s (W3C Controlled Identifiers v1.0);
  rotated keys are retained (so historical signatures still verify) and revoked
  keys are omitted.

  Each method is named by its key's own RFC 7638 thumbprint, in the URI form of
  RFC 9278, so a name never moves to another key when the keys are rotated. A
  token's `kid` is the absolute URL of the method that signed it. The first
  entry of `authentication` is the current key.
example:
  '@context':
    - https://www.w3.org/ns/did/v1
    - https://www.w3.org/ns/cid/v1
  id: did:web:id.odal-node.io
  verificationMethod:
    - id: did:web:id.odal-node.io#urn:ietf:params:oauth:jwk-thumbprint:sha-256:<thumbprint>
      type: JsonWebKey
      controller: did:web:id.odal-node.io
      publicKeyJwk:
        kty: OKP
        crv: Ed25519
        x: <base64url>
        kid: urn:ietf:params:oauth:jwk-thumbprint:sha-256:<thumbprint>
        alg: EdDSA
  authentication:
    - did:web:id.odal-node.io#urn:ietf:params:oauth:jwk-thumbprint:sha-256:<thumbprint>
  assertionMethod:
    - did:web:id.odal-node.io#urn:ietf:params:oauth:jwk-thumbprint:sha-256:<thumbprint>
