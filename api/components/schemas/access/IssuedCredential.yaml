type: object
description: |
  The minted credential, in both the forms a caller needs: the wire value the
  holder presents, and the same claims readable without decoding it.
required:
  - credentialJws
  - credential
properties:
  credentialJws:
    type: string
    description: |
      Compact VC-JWT — the value the holder sends as the `X-DPP-Credential`
      header. This is the credential; `credential` below is the same claims in
      readable form, not a second artefact.
  credential:
    type: object
    description: |
      The credential document, so a caller can show the holder what it says
      without decoding the JWS. Shape follows W3C VC Data Model v2.0.
    additionalProperties: true
