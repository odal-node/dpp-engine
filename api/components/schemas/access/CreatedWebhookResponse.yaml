description: >-
  The created subscription's fields, inlined, plus the signing secret. The
  secret is shown **once** — it is not recoverable from any later read.
allOf:
  - $ref: ./WebhookSubscription.yaml
  - type: object
    required:
      - secret
    properties:
      secret:
        type: string
        description: Signing secret. Store it now; it is never shown again.
