type: string
description: >-
  The deployment profile a node was started under (`NODE_PROFILE`), which
  decides the trust tiers it will boot on. `development` boots on any tier,
  placeholders included, and is what an unset or unrecognised value means.
  `sandbox` is a real deployment against test authorities: it refuses a
  placeholder on a required trust port and accepts a sandbox tier.
  `production` accepts only live tiers on required ports.
enum:
  - development
  - sandbox
  - production
