type: object
description: >-
  What the presented credential is. Reports only what the caller already sent —
  it reveals nothing about any other key, and the key's secret is never stored
  in a recoverable form.
required:
  - userId
  - scope
properties:
  userId:
    type: string
    description: The caller's identity, as authenticated.
  scope:
    $ref: ./ApiKeyScope.yaml
  keyId:
    type: string
    format: uuid
    description: >-
      The key's row id — never the token. Absent for local-admin Basic auth,
      which has no key row.
