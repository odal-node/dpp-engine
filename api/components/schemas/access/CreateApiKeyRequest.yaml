type: object
required:
  - name
properties:
  name:
    type: string
    description: Human-readable label for this key.
    example: CI pipeline
  expiresAt:
    type:
      - string
      - 'null'
    format: date-time
    description: Optional expiration. Null = never expires.
  scope:
    allOf:
      - $ref: ./ApiKeyScope.yaml
    description: >-
      Defaults to `admin` when omitted. Name `read` or `write` explicitly for a
      key issued to an integration.
