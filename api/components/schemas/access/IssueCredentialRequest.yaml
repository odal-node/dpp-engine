type: object
description: |
  Ask this node to vouch for a holder.

  The node signs with its own key, so the credential says "this operator
  attests that this party holds this role". That is a claim an operator is
  uniquely placed to make about its own authorised network, and one it has no
  standing to make about authority status — see `role`.
required:
  - holderDid
  - holderName
  - role
  - country
properties:
  holderDid:
    type: string
    description: |
      DID of the party being vouched for. A verifier matches it exactly, so a
      name or a URL here produces a credential nothing can present.
    example: did:web:repairs.example
  holderName:
    type: string
    description: Legal name of the holder, carried in the credential for an auditor.
    example: Nord Repair GmbH
  role:
    $ref: ./CredentialRole.yaml
  country:
    type: string
    pattern: '^[A-Za-z]{2}$'
    description: |
      ISO 3166-1 alpha-2 country of the holder's registration.

      Either case is accepted and the credential carries the upper-cased form,
      which is what a verifier compares against. Same reason for the pattern as
      on `countryOfDisposal`: a length bound alone admits `1?`.
    example: DE
  productGroups:
    type: array
    items:
      type: string
    description: |
      Product groups the credential covers. Omit or leave empty to cover every
      product group this operator publishes.
    example:
      - battery
  productCategories:
    type: array
    items:
      type: string
    description: |
      Product categories the credential covers within `productGroups`. Omit or
      leave empty to cover every category.

      The list is flat: it narrows every named group, and a read is admitted
      only where the passport states one of the listed values. A value is
      compared exactly with the category the passport's data states: a
      battery's `batteryType`, an electronics `productCategory`, a steel
      `productCategory`, a tyre `tyreClass`, a construction `productFamily`, a
      furniture or detergent `productType`. The legal values are that
      property's `enum` in the group's current schema
      (`GET /integrator/api/v1/schemas/{productGroup}`). Aluminium, mattress,
      textile, toy and unsold goods state no category.

      A list that cannot work as written is refused with `422` rather than
      signed: one given without `productGroups`, one holding a value no named
      group's passports can state, or one that leaves a named group with no
      passport the credential could read.
    example:
      - ev
  validForDays:
    type: integer
    minimum: 1
    maximum: 90
    default: 30
    description: |
      Lifetime in days.

      Nothing can withdraw a credential once issued — this node fetches W3C
      status lists but publishes none, so a credential it mints carries no
      `credentialStatus` — which makes the expiry the only control there is.
      That is why the ceiling is 90 rather than open-ended, and why the default
      is shorter still. Re-issuing is cheap.
    example: 30
