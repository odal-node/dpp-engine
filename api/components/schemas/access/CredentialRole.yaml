description: |
  The access role granted.

  Only roles carrying a **legitimate interest** may be issued here.
  `market_surveillance_authority`, `customs_authority` and `notified_body` map
  to the authority audience under Art. 77(2)(b) and are refused with `422`:
  authority status is conferred by a member state, so an operator signing itself
  one has attested nothing. An authority presents a credential from its own
  issuer, named in `CREDENTIAL_ISSUERS_AUTHORITY`.

  A product-group-specific role that none of the named ones fit uses the object
  form: the variant is externally tagged, so it is an object where the rest are
  strings. It carries a legitimate interest like the others, so a custom label
  that is an authority role's name, or the start of one's, is refused with `422`
  as well. Case, `-`, `_` and spaces do not matter: `market-surveillance`,
  `Market Surveillance` and `customs` are refused, and `customs-broker` is not.
oneOf:
  - type: string
    title: Named role
    enum:
      - authorised_repairer
      - recycler
      - remanufacturer
      - preparer_for_reuse
      - distributor
  - type: object
    title: Custom role
    required:
      - custom
    additionalProperties: false
    properties:
      custom:
        type: string
        description: Free-form role label, e.g. a product-group-specific one.
example: authorised_repairer
