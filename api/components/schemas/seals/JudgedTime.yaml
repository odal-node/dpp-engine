type: object
description: >-
  The moment a certificate's standing was judged against, and whether anything
  proves it.


  Regulation (EU) No 910/2014 Art. 32(1)(b), reached for seals by Art. 40, asks
  whether the certificate was valid **at the time of signing**. The whole verdict
  therefore turns on which moment is used and what that moment is worth.
required:
  - at
  - attested
properties:
  at:
    type: string
    format: date-time
    description: The moment used.
  attested:
    type: boolean
    description: >-
      True when the moment came from a timestamp token inside the seal, whose
      signature and imprint were both checked. False means it is the node's own
      clock — the validation time, not the signing time.


      This separates a failure from an open question. ETSI EN 319 102-1 treats a
      time nothing proves as no time at all, which is why a verdict resting on an
      unattested moment is reported with a `NO_POE` sub-indication rather than as
      `totalFailed`. Without it, every seal whose certificate has since expired —
      eventually all of them — would read as invalid.
