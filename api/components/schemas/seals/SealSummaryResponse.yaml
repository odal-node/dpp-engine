x-tags:
  - Seals
type: object
description: >-
  Operator-wide sealing state. Read `sealingConfigured` first: when it is false
  every count is `0` because this node has no outbox, **not** because nothing is
  outstanding.
required:
  - unsealedPublished
  - pending
  - sealed
  - exhausted
  - sealingConfigured
properties:
  unsealedPublished:
    type: integer
    description: Published passports carrying no seal at all. `0` is the healthy state.
  pending:
    type: integer
  sealed:
    type: integer
  exhausted:
    type: integer
    description: Rows that gave up after exhausting their retries.
  sealingConfigured:
    type: boolean
