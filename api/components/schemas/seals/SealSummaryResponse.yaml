type: object
description: >-
  Operator-wide sealing state. Read `sealingConfigured` first: when it is false
  every count is `0` because this node has no outbox, **not** because nothing is
  outstanding.
required:
  - unsealedPublished
  - unsealedTerminal
  - pending
  - sealed
  - exhausted
  - sealingConfigured
properties:
  unsealedPublished:
    type: integer
    description: >-
      Live published passports (`active` or `suspended`) carrying no seal at
      all. `0` is the healthy state.


      Live only. A passport that was published unsealed and has since been
      retired, superseded or deactivated is counted in `unsealedTerminal`, so
      this is the number to act on without first working out which of the
      passports behind it still matter.
  unsealedTerminal:
    type: integer
    description: >-
      Retired, superseded or deactivated passports that were published and carry
      no seal. They still serve publicly and the obligation attached at publish,
      so the repair sweep seals them too: this is what is left of that, and it
      falls as the sweep works through them.


      Unlike `unsealedPublished`, a non-zero value here is not by itself a call
      to act: the sweep is already working through it. A count that does not
      fall is a call to act: the seals the sweep asks for are failing, which
      `exhausted` counts and the node's log explains.
  pending:
    type: integer
  sealed:
    type: integer
  exhausted:
    type: integer
    description: Rows that gave up after exhausting their retries.
  sealingConfigured:
    type: boolean
  audit:
    oneOf:
      - $ref: ./SealAuditReport.yaml
      - type: 'null'
    description: >-
      What the last completed pass over every stored seal found.


      **`null` means no pass has completed**, not that nothing is wrong. The pass
      walks the estate in bounded batches and starts over, so this is empty until
      the first one finishes, and absent entirely on a deployment that runs no
      audit. Reporting a zero here for a check that has not run would be the one
      answer worse than reporting nothing.


      A node that keeps its audit state restores the last completed report at
      boot, so a restart no longer empties this. Where it is still `null` after a
      deployment, the honest reading is that no pass has ever finished against
      this database — on a large estate, check the audit's cadence before
      concluding anything about the seals.
  trustMode:
    type:
      - string
      - 'null'
    enum:
      - ghost
      - sandbox
      - live
      - null
    description: >-
      The tier the **currently configured** sealing backend resolved to. The
      counts say how much sealing is outstanding; this says whether the sealing
      that does happen is worth anything — a node can sit at
      `unsealedPublished: 0` while every one of those seals was signed by a key
      it generated itself, and no count would show it.


      A different question from the per-passport `origin`, and neither
      substitutes for the other: this describes the backend running now, that
      describes the certificate inside one stored seal. A node moved from a
      local backend to a QTSP last week reports `live` here and
      `selfIssued: true` on everything sealed before the move, and both are
      correct.


      Null on a deployment that resolved no seal port at all. That is **not**
      `ghost`: a port nobody wired and a port that landed on a placeholder are
      different states, and only the second blocks a production boot.
