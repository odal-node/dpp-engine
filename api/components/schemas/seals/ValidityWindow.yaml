type: object
description: >-
  A certificate's validity window, and where the sealing moment falls in it.


  The window travels with the verdict so a reader can check the arithmetic
  rather than take it on trust — and because the two dates are what an auditor
  compares against a Trusted List entry when asking the other half of
  Art. 32(1)(b).
required:
  - notBefore
  - notAfter
  - standing
properties:
  notBefore:
    type: string
    format: date-time
    description: The certificate's `notBefore`.
  notAfter:
    type: string
    format: date-time
    description: The certificate's `notAfter`.
  standing:
    type: string
    enum:
      - inside
      - expired
      - notYetValid
    description: >-
      Where the judged moment falls in the window. `expired` and `notYetValid`
      are findings only when that moment is attested — see `judgedAt`.
