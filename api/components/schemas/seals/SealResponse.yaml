type: object
description: >-
  The eIDAS seal, plus what is needed to check it — and an explicit statement of
  what this node did **not** check.
required:
  - declaredBy
  - format
  - sealValue
  - sealedAt
  - placeholder
  - currentJws
  - currentPayloadHash
  - coverage
  - binding
  - validation
  - archival
  - verification
properties:
  declaredBy:
    $ref: ./SealDeclarer.yaml
  format:
    type: string
    description: AdES format of `sealValue`.
    example: CADES
  sealValue:
    type: string
    description: Base64 detached CAdES (`.p7s`) as returned by the QTSP.
  sealedAt:
    type: string
    format: date-time
    description: >-
      **This node's clock when the backend answered — not a trusted timestamp.**
      Not necessarily when the signature was formed. A seal carries an
      independently established signing time only from baseline level `T`
      upward, where a timestamp authority attests it; at `B` there is no such
      token anywhere in the envelope, so this is an unattested claim by the
      party that bought the seal. Anything resting on *when* the seal was made
      must read the timestamp token out of `sealValue`.
  signingCertRef:
    type:
      - string
      - 'null'
    description: >-
      Hex SHA-256 of the certificate the seal names as its signer, **as reported
      by the seal** — read out of the CAdES, never verified. It answers *which*
      certificate to ask about, not whether that certificate was qualified or on
      the EU Trusted List. Null when the seal predates extraction or could not
      be parsed.
  attestedSealedAt:
    type:
      - string
      - 'null'
    format: date-time
    description: >-
      **When a timestamp authority attests the seal was made.**


      `sealedAt` is the sealing node's own clock and an unattested claim by the
      party that bought the seal. This is a third party's statement, read out of
      the time-stamp token inside `sealValue` — the only place in a seal an
      attested time can be.


      Checked rather than merely read: the token's own signature is verified and
      its imprint is matched against this seal's signature. The attribute
      carrying the token is *unsigned*, so a genuine token lifted from another
      seal would otherwise be accepted and report someone else's time as this
      one's.


      `null` for a `B-B` seal, which carries no token, and for a token that
      failed either check.


      **Attested is not trusted.** A qualified electronic time stamp is a QTSP's
      service (Art. 42) and the presumption of accuracy attaches to that
      (Art. 41(2)); establishing it is a Trusted List question about the
      `TSA/QTST` service type, which this node cannot yet ask. A self-signed
      authority's token verifies perfectly and means nothing.
  conformanceLevel:
    oneOf:
      - $ref: ../passport/SealConformanceLevel.yaml
      - type: 'null'
    description: >-
      The baseline level this node **asked** for, recorded on the envelope. A
      record of intent; `null` for a seal stored before the field existed.
  evidencedLevel:
    oneOf:
      - $ref: ../passport/SealConformanceLevel.yaml
      - type: 'null'
    description: >-
      The baseline level the seal's **bytes** carry.


      The pair is the point. A provider enabled for a weaker profile than was
      paid for returns a seal that is correct in every record this node keeps and
      stops verifying when its signing certificate expires — years later, on a
      passport that is retention-locked and cannot be re-sealed. Serving both
      makes that answerable from the seal rather than from a log nobody kept.


      A floor, not a conformance verdict: it reports that the distinguishing
      material for a level is present, never that the material was validated.
      `null` when the bytes could not be read.
  archival:
    $ref: ./ArchivalFreshness.yaml
  placeholder:
    type: boolean
    description: True when this is a placeholder with no legal validity.
  currentJws:
    type: string
    description: The passport's **current** compact JWS.
  currentPayloadHash:
    type: string
    description: Hex SHA-256 of `currentJws`.
  sealedPayloadHash:
    type:
      - string
      - 'null'
    description: >-
      Hex SHA-256 this node **asked** the backend to seal. A record, not proof:
      it says what was requested, while the validator's extracted message digest
      says what the CAdES actually covers. The two agreeing is the cross-check.
      Null for a seal restored from a backup or produced elsewhere.
  coverage:
    $ref: ./SealCoverage.yaml
  binding:
    $ref: ./SealBinding.yaml
  validation:
    $ref: ./SealValidationStatus.yaml
  certificate:
    oneOf:
      - $ref: ./CertificateStanding.yaml
      - type: 'null'
  origin:
    oneOf:
      - $ref: ./SealOrigin.yaml
      - type: 'null'
    description: >-
      What **this seal's own certificate** says about who issued it: did a
      provider issue it, or did the node sign it itself?


      Null means **not read** — a placeholder seal, a format this node does not
      parse, unreadable bytes, or a deployment with no inspector wired. Never
      read null as "not self-issued": that is a finding, and it only comes from
      a certificate that was actually examined.


      For what the *currently configured* backend produces, which is a different
      question, see `trustMode` on `GET /api/v1/seal`.
  verification:
    type: string
    description: >-
      Stated, not implied: this node did not cryptographically validate the
      CAdES. A detached CAdES must be checked by an independent AdES validator
      against the EU Trusted List.
