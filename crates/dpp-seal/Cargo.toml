[package]
name        = "dpp-seal"
description = "eIDAS qualified seal adapter for Odal Node — a hosted QTSP, a local dev sealer, or a ghost"
version.workspace     = true
edition.workspace     = true
authors.workspace     = true
license.workspace     = true
repository.workspace  = true
rust-version.workspace = true
publish = false

[dependencies]
dpp-domain   = { workspace = true }

# For `outbound` — the one guarded HTTP path. A trusted list fetch must use it
# rather than its own client: the list of lists names 43 URLs, we do not verify
# its signature, so those URLs are attacker-influenceable in principle. That is
# precisely what the resolving SSRF guard is for.
dpp-common   = { path = "../dpp-common" }

serde        = { workspace = true }
serde_json   = { workspace = true }
thiserror    = { workspace = true }
chrono       = { workspace = true }
async-trait  = { workspace = true }
tracing      = { workspace = true }

# eID Easy Cloud Direct e-Sealing: an HMAC-SHA256 over the exact request bytes.
reqwest      = { workspace = true }
hmac         = { workspace = true }
sha2         = { workspace = true }
base64       = { workspace = true }
hex          = { workspace = true }
url          = { workspace = true }
zeroize      = { workspace = true }

# Local development backend: a real detached CMS SignedData over the digest,
# signed by a self-signed key. Not qualified — the certificate is on no Trusted
# List — but structurally the shape a provider returns, so the whole pipeline is
# exercised without a provider account.
# `default-features = false` keeps `rsa` out of the tree: the `builder` feature
# pulls it in, we sign with P-256, and `rsa` 0.9 carries RUSTSEC-2023-0071 (Marvin
# timing sidechannel) with no fixed upgrade available.
# EU Trusted Lists are XML, and this parses them. A read-only DOM rather than a
# pull parser: the TS 119 612 shape is deeply nested with optional branches
# (`TSPService` -> `ServiceInformation` plus an optional `ServiceHistory` of
# instances), and a pull parser would need hand-rolled nesting state for each —
# more places for a hostile document to walk a parser into the wrong branch.
# Documents are bounded by the caller's fetch cap before they reach here, so
# holding one in memory is affordable and correctness wins.
#
# `roxmltree` forbids unsafe, has no transitive dependencies beyond its own
# tokenizer, and does no entity expansion — so the billion-laughs class of
# attack does not apply.
roxmltree    = "0.20"

# XMLDSig verification for trusted lists. Pure Rust, so the node stays a single
# self-hosted binary — the constraint that ruled out libxmlsec1 bindings and the
# EU DSS validator. See the workspace `[patch.crates-io]` for the vendored fix.
xml-sec      = "0.1.16"

cms          = { version = "0.2", default-features = false }
x509-cert    = "0.2"
der          = "0.7"
const-oid    = "0.9"
p256         = { version = "0.13", features = ["ecdsa", "pkcs8"] }
rcgen        = "0.14"

[dev-dependencies]
tempfile     = "3"
tokio = { workspace = true }
axum  = { workspace = true }
