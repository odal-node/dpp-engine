[package]
name        = "dpp-node"
description = "Odal Node MVP single binary — fuses vault, identity, integrator, registry connector and plugin host"
version.workspace     = true
edition.workspace     = true
authors.workspace     = true
license.workspace     = true
repository.workspace  = true
rust-version.workspace = true
publish = false

[lib]
name = "dpp_node"
path = "src/lib.rs"

[[bin]]
name = "dpp-node"
path = "src/main.rs"

[dependencies]
# Service libraries
dpp-domain = { workspace = true }
dpp-vc = { workspace = true }
dpp-crypto      = { workspace = true }
dpp-common             = { path = "../dpp-common" }
dpp-dal                = { path = "../dpp-dal" }
dpp-types              = { workspace = true }
dpp-vault              = { path = "../dpp-vault" }
dpp-render             = { path = "../dpp-render" }
dpp-identity   = { path = "../dpp-identity" }
dpp-integrator         = { path = "../dpp-integrator" }
dpp-seal               = { path = "../dpp-seal" }
dpp-registry           = { workspace = true }
dpp-rules              = { workspace = true }
dpp-plugin-host        = { path = "../dpp-plugin-host" }

# Event bus
async-nats   = { workspace = true }

# HTTP client (EU registry bridge)
reqwest      = { workspace = true }

# Runtime
async-trait  = { workspace = true }
tokio        = { workspace = true }
axum         = { workspace = true }
tower-http   = { workspace = true }
anyhow       = { workspace = true }
tracing                     = { workspace = true }
tracing-subscriber          = { workspace = true }
dotenvy                     = { workspace = true }
metrics                     = { workspace = true }
metrics-exporter-prometheus = { workspace = true }
serde        = { workspace = true }
serde_json   = { workspace = true }
uuid         = { workspace = true }
chrono       = { workspace = true }
ed25519-dalek = { workspace = true }
hex          = { workspace = true }
sha2         = { workspace = true }
hmac         = { workspace = true }
url          = { workspace = true }
base64       = { workspace = true }
serde_jcs    = { workspace = true }
thiserror    = { workspace = true }
aws-sdk-s3   = { workspace = true, optional = true }

[features]
# ESPR Art. 13 archive + continuity-snapshot S3/MinIO adapters. Off by
# default because object storage is an optional deployment dependency for a
# self-hosted node, not because of an advisory: the AWS SDK's vulnerable TLS
# edge was removed outright in the workspace `aws-sdk-s3` feature list (see
# the comment there), so `--features s3` and the default build now resolve
# the same rustls 0.23 stack. The published Docker image builds with this
# feature on (see docker/node.Dockerfile), so gating it does not reduce
# shipped risk and must never be relied on to.
s3 = ["dep:aws-sdk-s3"]
# Pulls in `s3` so the S3-backed integration tests (crates/dpp-node/tests/s3_archive.rs)
# exercise the real adapter, not just NoOpArchive.
integration-tests = ["s3"]

[dev-dependencies]
tower          = { version = "0.4", features = ["util"] }
serial_test    = "3"
wat            = "1"
futures        = "0.3"
criterion      = { workspace = true }
uuid           = { workspace = true }
testcontainers = { workspace = true }
reqwest        = { workspace = true }
tokio          = { workspace = true }
base64         = { workspace = true }
chrono         = { workspace = true }
async-nats     = { workspace = true }
dpp-common                  = { path = "../dpp-common" }
metrics-exporter-prometheus = { workspace = true }
# The seal simulation builds an EideasyConfig directly (its `hmac_key` is a
# `Zeroizing<String>`) and recomputes the digest the vault composes.
zeroize        = { workspace = true }
sha2           = { workspace = true }
hmac           = { workspace = true }
# The seal simulation writes a throwaway keystore. `tempfile` creates it with
# restrictive permissions and removes it on drop, which `std::env::temp_dir()`
# does neither of.
tempfile       = "3"

[[bench]]
name    = "nats_throughput"
harness = false
required-features = ["integration-tests"]
