[package]
name        = "dpp-cli"
description = "Odal Node management CLI for self-hosted installations"
version.workspace     = true
edition.workspace     = true
authors.workspace     = true
license.workspace     = true
repository.workspace  = true
rust-version.workspace = true
publish = false

[[bin]]
name = "odal"
path = "src/main.rs"

[dependencies]
dpp-types   = { workspace = true }
# `odal snapshot verify` checks a continuity snapshot with no node: `dpp-vc`
# for the bound verifier, `dpp-crypto` for reading a key out of a DID document.
# Both are already workspace pins consumed elsewhere here.
dpp-vc      = { workspace = true }
dpp-crypto  = { workspace = true }
# To decide whether a `--did-url` is reachable over a transport that can
# authenticate it. Hand-parsing a scheme and host is how `http://127.0.0.1.evil`
# gets treated as loopback.
url         = { workspace = true }
futures     = { workspace = true }
clap        = { workspace = true }
reqwest     = { workspace = true }
serde       = { workspace = true }
serde_json  = { workspace = true }
tokio       = { workspace = true }
indicatif   = { workspace = true }
toml        = { workspace = true }
csv         = { workspace = true }
anyhow      = { workspace = true }
chrono      = { workspace = true }
base64      = { workspace = true }
inquire     = { workspace = true }
console     = { workspace = true }
rfd         = { workspace = true, optional = true }
dirs        = { workspace = true }

[features]
# Native OS file-picker dialog (`Passports › Import`, `Verify`). Off by
# default because `odal` is meant to be a scriptable, API-driven control plane
# (see docs/architecture) — a GUI dialog in that binary is an opt-in shape,
# not the default one. It also keeps `rfd` and its desktop dependencies out
# of a server-side build. With the feature
# off, the picker menu option falls straight through to the existing
# typed-path prompt, which the console menu already offers as an equal
# alternative.
desktop = ["dep:rfd"]

[dev-dependencies]
tempfile    = "3"
