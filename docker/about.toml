# cargo-about: the third-party notice file shipped inside each published image.
#
# The images carry statically linked crates under MIT, Apache-2.0, BSD and
# similar licences, and most of those licences ask that their notice travel
# with every copy of the software, a compiled binary included. The Dockerfiles
# run `cargo about generate` against the exact crate graph and feature set each
# image is built from, and ship the result beside the engine's own LICENSE in
# /usr/share/licenses/odal-node/.
#
# It lives under docker/ so that a change to it reaches CI's image build, which
# only runs for changes the images can see.
#
# `accepted` mirrors deny.toml's `[licenses] allow`, which is the gate that
# decides what may enter the graph at all. Keep the two lists identical: a
# licence deny.toml admits and this file does not fails the image build, and one
# this file admits and deny.toml does not can never be reached.
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-1-Clause",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MPL-2.0",
    "Zlib",
    "0BSD",
    "BSL-1.0",
    "MIT-0",
    "Unicode-3.0",
    "Unlicense",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
]

# The engine's own crates are `publish = false` and covered by LICENSE, which
# the image ships separately.
private = { ignore = true }

# Build and dev dependencies never reach the binary.
ignore-build-dependencies = true
ignore-dev-dependencies = true
