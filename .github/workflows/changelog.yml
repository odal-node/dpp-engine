# Every pull request records itself in CHANGELOG.md, or says why it does not.
# The rule and its reasons are in scripts/changelog-check.sh.
#
# Its own workflow rather than a job in ci.yml because it must re-run when a
# label changes: adding `no-changelog` is how a change that needs no entry passes,
# and ci.yml does not run on `labeled`. It needs no toolchain, so it is cheap to
# re-run on every edit of the body.
name: Changelog

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

jobs:
  entry:
    name: CHANGELOG entry for this pull request
    runs-on: ubuntu-latest
    steps:
      # Full history: the gate compares with the base by commit, and CI's
      # checkout of a pull request has no `origin/main`.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Gate self-test
        run: bash scripts/changelog-check.test.sh
      - name: CHANGELOG cites this pull request
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: bash scripts/changelog-check.sh
