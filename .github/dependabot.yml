version: 2

# Grouping is deliberate. A dependency family has to move as one set or it
# cannot move at all: `aws-sdk-s3` could not leave its vulnerable rustls edge
# until the whole smithy stack came with it, and a single-crate PR for any one
# of them fails to resolve. Ungrouped weekly PRs also arrive faster than a solo
# maintainer can review them, which is how two dependabot regressions reached
# main in July. Frequency stays weekly; the batching is what changes.
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    labels:
      - dependencies
      - rust
    groups:
      aws:
        patterns:
          - "aws-*"
      web-stack:
        patterns:
          - "axum*"
          - "tower*"
          - "hyper*"
          - "reqwest"
      db-stack:
        patterns:
          - "sqlx*"
          - "redis"
          - "deadpool-*"
      cli:
        patterns:
          - "clap*"
          - "inquire"
          - "indicatif"
          - "console"
          - "rfd"
      test-stack:
        patterns:
          - "testcontainers*"
          - "proptest"
          - "criterion"
          - "serial_test"

  - package-ecosystem: docker
    directory: "/docker"
    schedule:
      interval: weekly
      day: monday
    labels:
      - dependencies
      - docker

  # Actions are pinned to full commit SHAs — an unpinned third-party action is
  # arbitrary code running against this repo's token. Dependabot understands
  # that form and bumps the SHA together with its trailing `# vN` comment.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    labels:
      - dependencies
      - ci
    groups:
      actions:
        patterns:
          - "*"
