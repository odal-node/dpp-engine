version: 2

# Grouping is deliberate. A dependency family has to move as one set or it
# cannot move at all: `aws-sdk-s3` could not leave its vulnerable rustls edge
# until the whole smithy stack came with it, and a single-crate PR for any one
# of them fails to resolve. Ungrouped weekly PRs also arrive faster than a solo
# maintainer can review them, which is how two dependabot regressions reached
# main in July. Frequency stays weekly; the batching is what changes.
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    labels:
      - dependencies
      - rust
    # The RustCrypto formats crates move as one release train — der 0.8,
    # spki 0.8, x509-cert 0.3, const-oid 0.10 — and `dpp-seal` cannot take any
    # of them individually. Bumping x509-cert alone puts der 0.8 in the graph
    # beside the der 0.7 that `cms 0.2` pins, and the two do not interoperate:
    # `AlgorithmIdentifier<x509_cert::der::Any>` stops satisfying `der::DerOrd`.
    # const-oid 0.10 and `der` itself fail on their own for the same reason: a
    # lone `der` 0.8 leaves `cms 0.2`'s types and `dpp-seal`'s on different
    # `der`s, and the seal path stops compiling.
    #
    # Everything on that train is stable except `cms`. Its only 0.3 builds are
    # pre-releases, and the newest (0.3.0-rc.0) rides stable der 0.8,
    # x509-cert 0.3, spki 0.8 and const-oid 0.10, with an optional `rsa` on
    # 0.10.0-rc.19. Release candidates do not belong under the eIDAS seal path,
    # and `cms` is pinned `default-features = false` precisely to keep rsa and
    # RUSTSEC-2023-0071 out of the tree — an avoidance that has to be checked
    # against the 0.3 feature set rather than assumed.
    #
    # RETURN WHEN `cms 0.3.0` IS PUBLISHED (not a pre-release). The whole stack
    # is then bumped in ONE PR (cms, der, x509-cert, const-oid, and these
    # ignores removed), with the rsa feature check redone.
    ignore:
      - dependency-name: "der"
      - dependency-name: "x509-cert"
      - dependency-name: "const-oid"
    groups:
      aws:
        patterns:
          - "aws-*"
      web-stack:
        patterns:
          - "axum*"
          - "tower*"
          - "hyper*"
          - "reqwest"
      db-stack:
        patterns:
          - "sqlx*"
          - "redis"
          - "deadpool-*"
      cli:
        patterns:
          - "clap*"
          - "inquire"
          - "indicatif"
          - "console"
          - "rfd"
      test-stack:
        patterns:
          - "testcontainers*"
          - "proptest"
          - "criterion"
          - "serial_test"
    cooldown:
      default-days: 7

  - package-ecosystem: docker
    directory: "/docker"
    schedule:
      interval: weekly
      day: monday
    labels:
      - dependencies
      - docker
    ignore:
      # The builder's `rust` tag follows rust-toolchain.toml — the toolchain CI
      # tests with — and the images job fails when they differ. A bump here
      # alone is how the images came to name 1.98 while compiling with 1.96.
      # Move the toolchain file and both FROM lines together, by hand.
      - dependency-name: "rust"
    cooldown:
      default-days: 7

  # Actions are pinned to full commit SHAs — an unpinned third-party action is
  # arbitrary code running against this repo's token. Dependabot understands
  # that form and bumps the SHA together with its trailing `# vN` comment.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    labels:
      - dependencies
      - ci
    groups:
      actions:
        patterns:
          - "*"
    cooldown:
      default-days: 7
