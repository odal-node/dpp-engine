# crate:      quick-xml 0.30.0
# path:       calamine 0.22.1 -> dpp-integrator -> dpp-node   [SHIPPED, normal
#             dependency, parses untrusted uploaded XLSX]
# class:      reachable-but-mitigated
# rationale:  O(N^2) duplicate-attribute-name scan on `BytesStart::attributes`
