#             quick-xml "0.39" — itself vulnerable to -0194) has no patched
#             release available. Mitigated in `xlsx_parser.rs`'s
#             `precheck_xlsx`, which caps attributes-per-tag
#             (`MAX_ATTRS_PER_TAG` = 64) across every XML part of the archive
#             — not just worksheets, since calamine parses
#             sharedStrings/styles/workbook.xml the same way — before
#             calamine ever opens the file. The guard's own scan uses
#             `.attributes().with_checks(false)` so it isn't exploitable
#             itself. Bounding N to 64 makes the O(N^2) cost trivial
#             regardless of which attribute-iteration API calamine uses
#             internally.
