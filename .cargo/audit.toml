# cargo-audit configuration
# https://github.com/rustsec/rustsec/blob/main/cargo-audit/README.md
#
# Every ignore entry below carries a structured header enforced by
# `scripts/check-audit-register.sh` (wired into `just check` / CI): a
# suppression rationale is a claim about the code, and prose claims rot
# silently without something re-checking them. `class` states the
# reachability claim as a checkable category, `anchor` is the code fact that
# makes it true, `expires` forces re-verification on a clock instead of
# leaving it to memory. See that script's header comment for the field
# contract.

[advisories]
# --- RUSTSEC-2023-0071 --------------------------------------------------
# crate:      rsa 0.9.10
# path:       dpp-seal -> x509-verify -> rsa
# class:      reachable-but-mitigated
# rationale:  The Marvin Attack is a timing sidechannel in RSA **private
#             key** operations — it recovers a key by timing an attacker's
#             decryption or signing queries against it. This workspace
#             performs no RSA private-key operation anywhere: it holds no
#             RSA key at all. Its own keys are Ed25519 (JWS) and P-256 (the
#             local seal backend), and `rsa` is reached solely to verify a
#             certificate authority's signature over a seal certificate,
#             using a public key read out of a published EU Trusted List.
#             Verification touches no secret, so there is no key to recover
#             and no oracle to time. `x509-verify` is pinned to the
#             algorithms measured in the published lists — RSA is 96.8% of
#             373 qualified-CA certificates, so dropping RSA is not an
#             option; see crates/dpp-seal/tests/ca_key_survey.rs.
#             THIS ENTRY IS VOID THE MOMENT ANY RSA PRIVATE-KEY OPERATION
#             APPEARS — signing, decrypting, or key generation. The
#             mitigation is the absence of a private key, not a workaround,
#             and `scripts/no-rsa-private-key.sh` (in `just check`) holds it:
#             it fails if any workspace crate takes `rsa` as a direct
#             dependency, or if RSA private-key material appears in our own
#             source. The claim is therefore checked rather than asserted.
# anchor:     scripts/no-rsa-private-key.sh::RsaPrivateKey
# owner:      LKSNDRTMLKV
# recorded:   2026-09-15
# expires:    2027-03-15
# release-on: `rsa` ships a constant-time fix, or `x509-verify` is replaced
#             by a verifier whose RSA implementation carries no advisory
#             (ring / aws-lc-rs), or this workspace stops verifying RSA
#             signatures.
# --- RUSTSEC-2026-0371 --------------------------------------------------
# crate:      zbus_names 4.3.4
# path:       dpp-cli [feature desktop] -> rfd -> ashpd -> zbus -> zbus_names
# class:      not-in-graph
# rationale:  An "unmaintained" notice, not a vulnerability: the crate was
#             merged into `zbus` 6.0.0 as its `names` module. It reaches this
#             workspace only through the opt-in `desktop` feature of the CLI
#             (rfd's xdg-portal backend, for the native file picker), which is
#             off by default and which neither the node image nor any CI build
#             enables: CI names features per package precisely so that
#             `cli/desktop` stays out. `cargo audit` reports it because it
#             scans the whole lockfile, optional features included. The class
#             check holds the claim: the crate is absent from both the default
#             graph and the shipped node build.
#             THIS ENTRY IS VOID THE MOMENT `desktop` BECOMES A DEFAULT FEATURE
#             OR ANY SHIPPED BUILD ENABLES IT.
# anchor:     cli/Cargo.toml::desktop
# owner:      LKSNDRTMLKV
# recorded:   2026-10-20
# expires:    2027-01-18
# release-on: `rfd` moves to a release that no longer depends on `ashpd` and
#             `zbus` (0.17 drops both), or `ashpd` moves to `zbus` 6.
