# cargo-audit configuration
# https://github.com/rustsec/rustsec/blob/main/cargo-audit/README.md
#
# Every ignore entry below carries a structured header enforced by
# `scripts/check-audit-register.sh` (wired into `just check` / CI): a
# suppression rationale is a claim about the code, and prose claims rot
# silently without something re-checking them. `class` states the
# reachability claim as a checkable category, `anchor` is the code fact that
# makes it true, `expires` forces re-verification on a clock instead of
# leaving it to memory. See that script's header comment for the field
# contract.

[advisories]
# --- RUSTSEC-2023-0071 --------------------------------------------------
# crate:      rsa 0.9.10
# path:       dpp-seal -> x509-verify -> rsa
# class:      reachable-but-mitigated
# rationale:  The Marvin Attack is a timing sidechannel in RSA **private
#             key** operations — it recovers a key by timing an attacker's
#             decryption or signing queries against it. This workspace
#             performs no RSA private-key operation anywhere: it holds no
#             RSA key at all. Its own keys are Ed25519 (JWS) and P-256 (the
#             local seal backend), and `rsa` is reached solely to verify a
#             certificate authority's signature over a seal certificate,
#             using a public key read out of a published EU Trusted List.
#             Verification touches no secret, so there is no key to recover
#             and no oracle to time. `x509-verify` is pinned to the
#             algorithms measured in the published lists — RSA is 96.8% of
#             373 qualified-CA certificates, so dropping RSA is not an
#             option; see crates/dpp-seal/tests/ca_key_survey.rs.
#             THIS ENTRY IS VOID THE MOMENT ANY RSA PRIVATE-KEY OPERATION
#             APPEARS — signing, decrypting, or key generation. The
#             mitigation is the absence of a private key, not a workaround,
#             and `scripts/no-rsa-private-key.sh` (in `just check`) holds it:
#             it fails if any workspace crate takes `rsa` as a direct
#             dependency, or if RSA private-key material appears in our own
#             source. The claim is therefore checked rather than asserted.
# anchor:     scripts/no-rsa-private-key.sh::RsaPrivateKey
# owner:      LKSNDRTMLKV
# recorded:   2026-09-15
# expires:    2027-03-15
# release-on: `rsa` ships a constant-time fix, or `x509-verify` is replaced
#             by a verifier whose RSA implementation carries no advisory
#             (ring / aws-lc-rs), or this workspace stops verifying RSA
#             signatures.
# --- RUSTSEC-2026-0387 --------------------------------------------------
# crate:      crypto-bigint 0.5.5
# path:       dpp-seal -> x509-verify -> p256 / p384 / p521 0.13 ->
#             elliptic-curve 0.13 -> crypto-bigint 0.5
# class:      reachable-but-mitigated
# rationale:  Operations meant to be constant-time (subtraction, division,
#             Montgomery multiplication) could branch on the values they
#             compute, which leaks a secret integer through timing. The 0.5
#             line has no fix: the advisory is patched from 0.7.6, and the
#             0.7 copy in this lockfile is past it. 0.5 is reached only
#             through `x509-verify`, whose ECDSA code checks a certificate's
#             signature with the issuer's public key. Verification holds no
#             secret, so a timing channel has nothing to leak. The node's own
#             P-256 signing keys (the local development sealer and its
#             timestamp authority) are on `p256` 0.14, a direct dependency of
#             dpp-seal, and so on the patched crypto-bigint 0.7.
#             THIS ENTRY IS VOID THE MOMENT ANY CODE SIGNS, DERIVES A SHARED
#             SECRET OR GENERATES A KEY WITH THE 0.13 CURVE CRATES.
# anchor:     crates/dpp-seal/src/cades/signature.rs::VerifyingKey
# owner:      LKSNDRTMLKV
# recorded:   2026-10-27
# expires:    2027-04-27
# release-on: `x509-verify` moves to the 0.14 curve crates, or is replaced by
#             a verifier that does not pull crypto-bigint 0.5.
# --- RUSTSEC-2026-0440 --------------------------------------------------
# crate:      astral-tokio-tar 0.6.4
# path:       dpp-dal / dpp-vault / dpp-node [dev-dependencies] -> testcontainers
#             0.27 -> astral-tokio-tar
# class:      dev-only
# rationale:  The advisory is "unmaintained", not a vulnerability: it names no
#             flaw. The crate is a tar library that `testcontainers` depends on,
#             and `testcontainers` is a dev-dependency of the crates above (the
#             DAL reaches it through its `test-harness` feature, which is only
#             ever enabled from `[dev-dependencies]`), so it is compiled into the
#             Docker-backed test suites and into no shipped binary.
#             `scripts/check-audit-register.sh` checks the second half of that:
#             it fails if the crate appears in the normal dependency graph.
#             `testcontainers` 0.28.0, the newest release, still depends on it,
#             so a bump does not clear the advisory.
# anchor:     crates/dpp-dal/Cargo.toml::test-harness
# owner:      LKSNDRTMLKV
# recorded:   2026-11-05
# expires:    2027-02-05
# release-on: `testcontainers` releases a version that no longer depends on
#             `astral-tokio-tar`, or the crate is maintained again.
ignore = [
