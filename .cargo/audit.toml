# cargo-audit configuration
# https://github.com/rustsec/rustsec/blob/main/cargo-audit/README.md
#
# Every ignore entry below carries a structured header enforced by
# `scripts/check-audit-register.sh` (wired into `just check` / CI): a
# suppression rationale is a claim about the code, and prose claims rot
# silently without something re-checking them. `class` states the
# reachability claim as a checkable category, `anchor` is the code fact that
# makes it true, `expires` forces re-verification on a clock instead of
# leaving it to memory. See that script's header comment for the field
# contract.

[advisories]
