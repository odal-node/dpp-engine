# --- RUSTSEC-2026-0098 -------------------------------------------------------
# crate:      rustls-webpki 0.101.7
# path:       aws-sdk-s3 -> aws-runtime -> aws-smithy-http-client -> rustls
#             0.21.12 -> rustls-webpki 0.101.7   [SHIPPED, normal dependency]
# class:      reachable-accepted
# rationale:  Name-constraint bypass for URI names. Upstream-blocked: pulled
#             by rustls 0.21 via hyper-rustls 0.24, the newest connector
#             aws-smithy-http-client 1.1.13 (latest published) ships — no
#             `cargo update` can move it until smithy migrates to rustls 0.23.
#             S3 IS wired: `dpp-node/src/main.rs` constructs `S3ArchiveAdapter`
#             under `TrustMode::Live` when `ARCHIVE_S3_BUCKET` is set, and
#             `S3SnapshotStore` for the continuity tier — both compile this
#             path in unconditionally, only their *construction* is
#             env-gated. Per the advisory the bug is "reachable only after
#             signature verification and requires misissuance [of a
#             name-constrained CA] to exploit" — the SDK's default HTTPS
#             client trusts the public CA store, which does not issue
#             name-constrained intermediates for S3. No code-level mitigation
#             exists today; this is an accepted residual risk, not a guarded
#             one.
# anchor:     — (reachable-accepted: manual sign-off, no code anchor)
# owner:      founder
# recorded:   2026-07-27
# expires:    2026-08-26
# release-on: aws-smithy-http-client ships a rustls-0.23 connector, or a
#             custom rustls-0.23 connector for aws-sdk-s3 is added
#
