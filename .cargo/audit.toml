# cargo-audit configuration
# https://github.com/rustsec/rustsec/blob/main/cargo-audit/README.md
#
# Every ignore entry below carries a structured header enforced by
# `scripts/check-audit-register.sh` (wired into `just check` / CI): a
# suppression rationale is a claim about the code, and prose claims rot
# silently without something re-checking them. `class` states the
# reachability claim as a checkable category, `anchor` is the code fact that
# makes it true, `expires` forces re-verification on a clock instead of
# leaving it to memory. See that script's header comment for the field
# contract.

[advisories]
# --- RUSTSEC-2023-0071 -------------------------------------------------------
# crate:      rsa 0.9.10
# path:       sqlx-mysql -> sqlx / sqlx-macros-core   [ORPHANED]
# class:      not-in-graph
# rationale:  `rsa` and `sqlx-mysql` are `[[package]]` entries in Cargo.lock
#             (sqlx's own optional MySQL support), but neither is part of the
#             actual resolved dependency graph: no crate enables sqlx's
#             "mysql" feature (dpp-dal enables only postgres, runtime-tokio,
#             tls-rustls, uuid, chrono, json, migrate, macros), `cargo
#             metadata`'s resolve graph has no rsa or sqlx-mysql node, and
#             neither produces a compiled artifact under target/debug/deps.
#             The previous rationale (reachable via `bollard`/testcontainers)
#             named the wrong path — its conclusion (not shipped) held, the
#             claimed mechanism didn't.
# anchor:     cargo tree -i rsa --target all
# owner:      founder
# recorded:   2026-07-27
# expires:    2026-10-25
# release-on: a `cargo update` prunes the orphaned Cargo.lock entries, which
#             removes this ID from the lockfile (and the need for this
#             suppression) entirely
ignore = [
    "RUSTSEC-2023-0071",
]
